<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像生成プロンプト見本一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --bg-alt: #070b10;
    --panel: #0e1620;
    --panel-hi: #121d29;
    --line: #1e3038;
    --line-soft: #14212a;
    --cyan: #00f0d0;
    --cyan-dim: #0a4a44;
    --magenta: #ff2f6e;
    --magenta-dim: #4a0f24;
    --amber: #ffb020;
    --text: #f5f9fa;
    --text-dim: #b8c4cc;
    --text-faint: #5c6b73;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'IBM Plex Sans JP', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  button, input, textarea { font-family: inherit; color: inherit; }
  ::selection { background: var(--cyan); color: #000; }

  .app-shell { height: 100%; display: flex; flex-direction: column; }

  /* ---- top bar ---- */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .app-bar .app-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); letter-spacing: .04em; white-space: nowrap; }
  .bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-alt); border: 1px solid var(--line); padding: 5px 10px;
    min-width: 0;
  }
  .search-box input {
    background: transparent; border: none; outline: none; font-size: 12px; color: var(--text);
    width: 140px;
  }
  .search-box input::placeholder { color: var(--text-faint); }
  .tag-filter-chips {
    display: flex; gap: 5px; flex-wrap: wrap; max-width: 260px;
  }
  .chip {
    font-size: 10px; padding: 3px 8px; border: 1px solid var(--line); color: var(--text-dim);
    cursor: pointer; white-space: nowrap; background: transparent;
  }
  .chip.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }

  .btn {
    font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary:hover { background: var(--cyan-dim); }
  .btn.danger { border-color: var(--magenta-dim); color: var(--magenta); }
  .btn.danger:hover { background: var(--magenta-dim); }

  /* ---- hamburger menu ---- */
  .menu-wrap { position: relative; flex-shrink: 0; }
  .hamburger-btn {
    width: 30px; height: 30px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hamburger-btn:hover, .hamburger-btn.is-active { border-color: var(--cyan-dim); color: var(--cyan); }

  /* ---- ハンバーガーメニュー：一覧（項目を選ぶだけの軽い画面） ---- */
  .menu-panel {
    position: absolute; top: calc(100% + 6px); right: 0; width: 200px;
    background: var(--panel); border: 1px solid var(--line); z-index: 40; display: none;
    padding: 6px;
  }
  .menu-panel.is-open { display: block; }
  .menu-panel-item {
    width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text-dim); font-size: 12px; padding: 9px 10px; cursor: pointer;
  }
  .menu-panel-item:hover { background: var(--bg-alt); color: var(--cyan); }
  .menu-panel-item.danger:hover { color: var(--magenta); }

  /* ---- サブモーダル（よく使うタグ／タグの色） ---- */
  .sub-modal { width: 100%; max-width: 340px; }
  .sub-modal-body { max-height: 60vh; overflow-y: auto; padding-top: 4px; }
  .freq-tag-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .freq-tag-add-row input {
    flex: 1; background: var(--bg-alt); border: 1px solid var(--line); padding: 6px 8px;
    font-size: 11px; color: var(--text); outline: none;
  }
  .freq-tag-add-row input:focus { border-color: var(--cyan-dim); }
  .freq-tag-list, .tag-color-list { display: flex; flex-direction: column; gap: 6px; }
  .freq-tag-row, .tag-color-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .freq-tag-row .ftr-name, .tag-color-row .tcr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .freq-tag-row button {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 10px; width: 20px; height: 20px; cursor: pointer; flex-shrink: 0;
  }
  .freq-tag-row button:hover { border-color: var(--magenta-dim); color: var(--magenta); }
  .tag-color-row { flex-shrink: 0; }
  .tag-color-row .tcr-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tag-color-row input[type="color"] {
    width: 26px; height: 22px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 0;
  }
  .tag-color-row .tcr-reset {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 9.5px; padding: 3px 6px; cursor: pointer;
  }
  .tag-color-row .tcr-reset:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .menu-empty-hint { font-size: 10.5px; color: var(--text-faint); line-height: 1.6; }

  /* ---- 「よく使うタグ」チップ（登録・編集モーダル内） ---- */
  .freq-tag-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .freq-tag-picker .chip { font-size: 10px; padding: 3px 8px; }

  /* ---- 選択削除モード ---- */
  .select-mode-hint {
    padding: 8px 16px; background: var(--magenta-dim); border-bottom: 1px solid var(--magenta);
    font-size: 11px; color: var(--text); flex-shrink: 0; display: none;
  }
  .select-mode-hint.is-active { display: block; }
  .card.select-target { cursor: pointer; }
  .card-erase-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(74, 15, 36, .55); border: 2px solid var(--magenta);
  }
  .card-erase-overlay.is-marked { display: flex; }
  .card-erase-overlay .erase-label {
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .06em;
    color: var(--magenta); text-shadow: 0 0 8px rgba(255,47,110,.6);
  }

  /* ---- grid ---- */
  .app-body { flex: 1; overflow-y: auto; padding: 18px; min-height: 0; position: relative; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;
  }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--text-faint); flex-direction: column; gap: 10px; padding: 40px;
  }
  .empty-state .big { font-family: var(--font-display); font-size: 13px; color: var(--text-dim); letter-spacing: .04em; }
  .empty-state .small { font-size: 11px; max-width: 320px; line-height: 1.8; }

  .card {
    position: relative; aspect-ratio: 1; overflow: hidden; cursor: default;
    border: 1px solid var(--line); background: var(--panel);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-title {
    position: absolute; top: 0; left: 0; right: 0; padding: 7px 9px 14px;
    background: linear-gradient(180deg, rgba(5,7,10,.88), transparent);
    font-size: 11.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    pointer-events: none;
  }
  .card-tags {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 7px;
    background: linear-gradient(0deg, rgba(5,7,10,.9), transparent);
    display: flex; gap: 4px; flex-wrap: wrap; pointer-events: none;
  }
  .card-tags .tag-pill {
    font-size: 9px; padding: 2px 6px; background: rgba(0,240,208,.12); border: 1px solid var(--cyan-dim);
    color: var(--cyan); white-space: nowrap;
  }
  /* ---- hover prompt popup ---- */
  /* 半透明にして背後の画像が薄っすら透けて見えるようにしつつ、
     文字は十分読める濃さに調整（右上の別アイコン方式は廃止し、
     編集・削除もこのポップアップ内に統合した）。 */
  .prompt-pop {
    position: absolute; inset: 0; background: rgba(5,7,10,.82);
    display: flex; flex-direction: column; padding: 12px; gap: 8px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
    overflow-y: auto;
  }
  .card:hover .prompt-pop { opacity: 1; pointer-events: auto; }
  .card.select-target:hover .prompt-pop { opacity: 0; pointer-events: none; }
  .prompt-pop .pp-block { display: flex; flex-direction: column; gap: 4px; }
  .prompt-pop .pp-label { font-family: var(--font-display); font-size: 9px; letter-spacing: .08em; color: var(--text-faint); }
  .prompt-pop .pp-text {
    font-size: 10.5px; line-height: 1.5; color: var(--text-dim);
    max-height: 78px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .prompt-pop .pp-copy {
    align-self: flex-start; font-size: 9.5px; padding: 3px 8px; margin-top: 2px;
    background: transparent; border: 1px solid var(--cyan-dim); color: var(--cyan); cursor: pointer;
  }
  .prompt-pop .pp-copy:hover { background: var(--cyan-dim); }
  .prompt-pop .pp-copy.copied { border-color: var(--cyan); background: var(--cyan-dim); }
  .prompt-pop .pp-empty { font-size: 10px; color: var(--text-faint); font-style: italic; }
  .prompt-pop .pp-footer {
    margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .prompt-pop .pp-footer button {
    font-size: 10px; padding: 4px 10px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer;
  }
  .prompt-pop .pp-footer .pp-edit:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .prompt-pop .pp-footer .pp-delete:hover { border-color: var(--magenta-dim); color: var(--magenta); }

  /* ---- modal (add/edit) ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); padding: 18px 20px 20px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
  }
  .modal-head .modal-title { font-family: var(--font-display); font-size: 13px; color: var(--text); letter-spacing: .04em; }
  .modal-close { width: 22px; height: 22px; background: transparent; border: 1px solid var(--line); color: var(--text-faint); font-size: 12px; cursor: pointer; }
  .modal-close:hover { border-color: var(--magenta); color: var(--magenta); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 10px; color: var(--text-faint); letter-spacing: .04em; margin-bottom: 5px; }
  .field input[type="text"], .field textarea {
    width: 100%; background: var(--bg-alt); border: 1px solid var(--line); padding: 8px 9px;
    font-size: 12px; color: var(--text); outline: none; resize: vertical;
  }
  .field input[type="text"]:focus, .field textarea:focus { border-color: var(--cyan-dim); }
  .field textarea { min-height: 60px; line-height: 1.5; }
  .field-hint { font-size: 9.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }

  .image-drop {
    border: 1px dashed var(--line); padding: 14px; text-align: center; cursor: pointer;
    color: var(--text-faint); font-size: 11px; position: relative; overflow: hidden;
    min-height: 90px; display: flex; align-items: center; justify-content: center;
  }
  .image-drop:hover { border-color: var(--cyan-dim); }
  .image-drop.has-image { padding: 0; }
  .image-drop img { width: 100%; max-height: 180px; object-fit: contain; display: block; }
  .image-drop input[type="file"] { display: none; }

  .tag-input-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--bg-alt); border: 1px solid var(--line); padding: 6px 8px; }
  .tag-input-row .tag-pill-edit {
    font-size: 10px; padding: 2px 6px; background: var(--cyan-dim); color: var(--cyan); display: flex; align-items: center; gap: 4px;
  }
  .tag-pill-edit button { background: transparent; border: none; color: var(--cyan); cursor: pointer; font-size: 11px; line-height: 1; padding: 0; }
  .tag-input-row input {
    flex: 1; min-width: 80px; background: transparent; border: none; outline: none; font-size: 11px; color: var(--text);
  }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--panel); border: 1px solid var(--cyan-dim); color: var(--cyan);
    font-size: 11px; padding: 8px 16px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- confirm dialog ---- */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 70; padding: 20px;
  }
  .confirm-overlay.is-open { display: flex; }
  .confirm-box {
    width: 100%; max-width: 300px; background: var(--panel); border: 1px solid var(--magenta-dim); padding: 16px 18px;
  }
  .confirm-box .cf-msg { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 14px; }
  .confirm-box .cf-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-bar">
    <span class="app-title">// PROMPT GALLERY</span>
    <div class="bar-right">
      <div class="search-box">
        <span style="color:var(--text-faint); font-size:11px;">⌕</span>
        <input type="text" id="searchInput" placeholder="タイトル・タグで検索">
      </div>
      <div class="tag-filter-chips" id="tagChips"></div>
      <button class="btn primary" id="addBtn">＋ 新規登録</button>
      <div class="menu-wrap">
        <button class="hamburger-btn" id="hamburgerBtn" title="設定メニュー">☰</button>
        <div class="menu-panel" id="menuPanel">
          <button class="menu-panel-item" id="menuItemFreqTags" type="button">よく使うタグ</button>
          <button class="menu-panel-item" id="menuItemTagColors" type="button">タグの色</button>
          <button class="menu-panel-item" id="menuItemSelectMode" type="button">選択して削除</button>
        </div>
        <div class="menu-panel" id="selectModeMenuPanel">
          <button class="menu-panel-item" id="menuItemExitSelect" type="button">モード解除</button>
          <button class="menu-panel-item danger" id="menuItemDeleteSelected" type="button">削除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="select-mode-hint" id="selectModeHint">選択削除モード：削除したいカードをクリックして選択してください。</div>

  <div class="app-body">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 登録/編集モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">新規登録</span>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>

    <div class="field">
      <label>画像</label>
      <div class="image-drop" id="imageDrop">
        <span id="imageDropText">クリックして画像を選択</span>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      <div class="field-hint">端末内の画像をこのアプリ内にコピー保存します（IndexedDB／同一ブラウザ内のみ）。</div>
    </div>

    <div class="field">
      <label>タイトル</label>
      <input type="text" id="titleInput" maxlength="60" placeholder="例：ネオン街の少女">
    </div>

    <div class="field">
      <label>プロンプト（本文）</label>
      <textarea id="promptInput" placeholder="生成に使用したプロンプト本文"></textarea>
    </div>

    <div class="field">
      <label>ネガティブプロンプト（任意）</label>
      <textarea id="negativeInput" placeholder="ネガティブプロンプト（未使用なら空欄でOK）"></textarea>
    </div>

    <div class="field">
      <label>タグ（Enterで追加）</label>
      <div class="tag-input-row" id="tagInputRow">
        <input type="text" id="tagInput" placeholder="タグを入力してEnter">
      </div>
      <div class="freq-tag-picker" id="freqTagPicker"></div>
    </div>

    <div class="modal-footer">
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- サブモーダル：よく使うタグ -->
<div class="modal-overlay" id="freqTagModalOverlay">
  <div class="modal sub-modal">
    <div class="modal-head">
      <span class="modal-title">よく使うタグ</span>
      <button class="modal-close" id="freqTagModalCloseBtn">✕</button>
    </div>
    <div class="sub-modal-body">
      <div class="freq-tag-add-row">
        <input type="text" id="freqTagAddInput" placeholder="タグ名を入力して追加">
        <button class="btn" id="freqTagAddBtn">追加</button>
      </div>
      <div class="freq-tag-list" id="freqTagList"></div>
    </div>
  </div>
</div>

<!-- サブモーダル：タグの色 -->
<div class="modal-overlay" id="tagColorModalOverlay">
  <div class="modal sub-modal">
    <div class="modal-head">
      <span class="modal-title">タグの色</span>
      <button class="modal-close" id="tagColorModalCloseBtn">✕</button>
    </div>
    <div class="sub-modal-body">
      <div class="tag-color-list" id="tagColorList"></div>
    </div>
  </div>
</div>

<!-- 削除確認 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="cf-msg" id="confirmMsg">この登録を削除します。画像・プロンプトは復元できません。よろしいですか？</div>
    <div class="cf-actions">
      <button class="btn" id="confirmCancelBtn">キャンセル</button>
      <button class="btn danger" id="confirmDeleteBtn">削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     IndexedDB レイヤー
     画像はBlobのまま保存（Base64化によるサイズ膨張・容量圧迫を避けるため）。
     1件 = { id, title, prompt, negative, tags: string[], image: Blob, createdAt }
  ===================================================================== */
  const DB_NAME = 'sideops_prompt_gallery';
  const DB_VERSION = 2;
  const STORE = 'entries';
  const SETTINGS_STORE = 'settings';
  let db = null;

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (ev) => {
        const _db = ev.target.result;
        if (!_db.objectStoreNames.contains(STORE)) {
          const store = _db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('createdAt', 'createdAt', { unique: false });
        }
        if (!_db.objectStoreNames.contains(SETTINGS_STORE)) {
          _db.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function settingsStore(mode) {
    const tx = db.transaction(SETTINGS_STORE, mode);
    return tx.objectStore(SETTINGS_STORE);
  }

  function dbGetSetting(key) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readonly').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  }

  function dbSetSetting(key, value) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readwrite').put({ key, value });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function txStore(mode) {
    const tx = db.transaction(STORE, mode);
    return tx.objectStore(STORE);
  }

  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const req = txStore('readonly').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(entry) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').put(entry);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  /* ===================== state ===================== */
  let entries = [];          // メモリ上のキャッシュ
  let activeTagFilter = null;
  let searchQuery = '';
  let editingId = null;      // モーダルが編集中のentry id（nullなら新規）
  let pendingImageFile = null; // モーダルで選択中の新しい画像ファイル（未保存）
  let editTags = [];          // モーダル編集中のタグ配列
  let frequentTags = [];      // ユーザーが登録した「よく使うタグ」の配列
  let tagColors = {};         // { タグ名: '#rrggbb' } のマップ
  let selectMode = false;             // 選択削除モードのON/OFF
  let selectedForDelete = new Set();  // 選択削除モード中に選んだentry idの集合

  /* ===================== DOM refs ===================== */
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const tagChips = document.getElementById('tagChips');
  const addBtn = document.getElementById('addBtn');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const saveBtn = document.getElementById('saveBtn');

  const imageDrop = document.getElementById('imageDrop');
  const titleInput = document.getElementById('titleInput');
  const promptInput = document.getElementById('promptInput');
  const negativeInput = document.getElementById('negativeInput');
  const tagInputRow = document.getElementById('tagInputRow');
  const tagInput = document.getElementById('tagInput');
  const freqTagPicker = document.getElementById('freqTagPicker');

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const menuPanel = document.getElementById('menuPanel');
  const selectModeMenuPanel = document.getElementById('selectModeMenuPanel');
  const menuItemFreqTags = document.getElementById('menuItemFreqTags');
  const menuItemTagColors = document.getElementById('menuItemTagColors');
  const menuItemSelectMode = document.getElementById('menuItemSelectMode');
  const menuItemExitSelect = document.getElementById('menuItemExitSelect');
  const menuItemDeleteSelected = document.getElementById('menuItemDeleteSelected');
  const selectModeHint = document.getElementById('selectModeHint');

  const freqTagModalOverlay = document.getElementById('freqTagModalOverlay');
  const freqTagModalCloseBtn = document.getElementById('freqTagModalCloseBtn');
  const freqTagAddInput = document.getElementById('freqTagAddInput');
  const freqTagAddBtn = document.getElementById('freqTagAddBtn');
  const freqTagList = document.getElementById('freqTagList');

  const tagColorModalOverlay = document.getElementById('tagColorModalOverlay');
  const tagColorModalCloseBtn = document.getElementById('tagColorModalCloseBtn');
  const tagColorList = document.getElementById('tagColorList');

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ===================== タグ色ユーティリティ =====================
     背景色の相対輝度（WCAG簡易版）から、読みやすい文字色（黒 or 白）を自動判定する。
     色未設定のタグは、既存デザインのcyanトーンをそのまま使う（見た目の後方互換）。 */
  function hexToRgb(hex) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return null;
    const num = parseInt(m[1], 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function relativeLuminance({ r, g, b }) {
    const [R, G, B] = [r, g, b].map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }
  function tagColorCss(tagName) {
    const color = tagColors[tagName];
    if (!color) return null;
    const rgb = hexToRgb(color);
    if (!rgb) return null;
    const textColor = relativeLuminance(rgb) > 0.5 ? '#0a0a0a' : '#f5f9fa';
    return `background:${color}; border-color:${color}; color:${textColor};`;
  }
  function tagPillStyle(tagName) {
    const css = tagColorCss(tagName);
    return css ? ` style="${css}"` : '';
  }

  /* ===================== 画像URL管理 =====================
     Blob→ObjectURLは作成しっぱなしにするとメモリリークするため、
     再描画のたびに古いURLをrevokeしてから新しく生成する。 */
  let activeObjectUrls = new Set();
  function revokeAllObjectUrls() {
    activeObjectUrls.forEach(u => URL.revokeObjectURL(u));
    activeObjectUrls.clear();
  }
  function makeObjectUrl(blob) {
    const url = URL.createObjectURL(blob);
    activeObjectUrls.add(url);
    return url;
  }

  /* ===================== データ読み込み・描画 ===================== */
  async function loadAndRender() {
    entries = await dbGetAll();
    entries.sort((a, b) => b.createdAt - a.createdAt);
    renderTagChips();
    renderGrid();
  }

  function getAllTags() {
    const set = new Set();
    entries.forEach(e => (e.tags || []).forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  function renderTagChips() {
    const tags = getAllTags();
    tagChips.innerHTML = '';
    tags.forEach(tag => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (activeTagFilter === tag ? ' active' : '');
      chip.textContent = tag;
      chip.disabled = selectMode;
      if (activeTagFilter === tag) {
        const color = tagColors[tag];
        if (color) {
          chip.style.borderColor = color;
          chip.style.color = color;
          chip.style.background = 'transparent';
        }
      }
      chip.addEventListener('click', () => {
        activeTagFilter = (activeTagFilter === tag) ? null : tag;
        renderTagChips();
        renderGrid();
      });
      tagChips.appendChild(chip);
    });
  }

  function matchesFilter(entry) {
    if (activeTagFilter && !(entry.tags || []).includes(activeTagFilter)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const inTitle = (entry.title || '').toLowerCase().includes(q);
      const inTags = (entry.tags || []).some(t => t.toLowerCase().includes(q));
      if (!inTitle && !inTags) return false;
    }
    return true;
  }

  function renderGrid() {
    revokeAllObjectUrls();
    const list = entries.filter(matchesFilter);
    const bodyEl = grid.parentElement;
    const existingEmpty = bodyEl.querySelector('.empty-state');
    if (existingEmpty) existingEmpty.remove();

    if (entries.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">まだ登録がありません</div>
        <div class="small">右上の「＋ 新規登録」から、画像とプロンプトを登録してみましょう。</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    if (list.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">該当する登録がありません</div>
        <div class="small">検索条件やタグ絞り込みを変えてみてください。</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    grid.innerHTML = '';
    list.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = entry.id;

      const imgUrl = entry.image ? makeObjectUrl(entry.image) : '';
      const tagsHtml = (entry.tags || []).map(t => `<span class="tag-pill"${tagPillStyle(t)}>${escapeHtml(t)}</span>`).join('');
      const isMarked = selectedForDelete.has(entry.id);

      card.innerHTML = `
        ${imgUrl ? `<img src="${imgUrl}" alt="${escapeHtml(entry.title || '')}">` : ''}
        <div class="card-title">${escapeHtml(entry.title || '(無題)')}</div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="prompt-pop">
          <div class="pp-block">
            <div class="pp-label">PROMPT</div>
            ${entry.prompt ? `<div class="pp-text">${escapeHtml(entry.prompt)}</div><button class="pp-copy" data-kind="prompt">本文コピー</button>` : '<div class="pp-empty">未入力</div>'}
          </div>
          <div class="pp-block">
            <div class="pp-label">NEGATIVE</div>
            ${entry.negative ? `<div class="pp-text">${escapeHtml(entry.negative)}</div><button class="pp-copy" data-kind="negative">ネガティブコピー</button>` : '<div class="pp-empty">未入力</div>'}
          </div>
          <div class="pp-footer">
            <button class="pp-edit" type="button">編集</button>
            <button class="pp-delete" type="button">削除</button>
          </div>
        </div>
        <div class="card-erase-overlay${isMarked ? ' is-marked' : ''}"><span class="erase-label">消去</span></div>
      `;

      if (selectMode) {
        card.classList.add('select-target');
        card.addEventListener('click', () => toggleSelectForDelete(entry.id));
      } else {
        card.querySelector('.pp-edit').addEventListener('click', (e) => { e.stopPropagation(); openEditModal(entry); });
        card.querySelector('.pp-delete').addEventListener('click', (e) => { e.stopPropagation(); openConfirmDelete(entry.id); });

        card.querySelectorAll('.pp-copy').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const kind = btn.dataset.kind;
            const text = kind === 'prompt' ? (entry.prompt || '') : (entry.negative || '');
            try {
              await navigator.clipboard.writeText(text);
              const original = btn.textContent;
              btn.textContent = 'コピーしました';
              btn.classList.add('copied');
              setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
            } catch (err) {
              showToast('コピーに失敗しました（ブラウザ設定をご確認ください）');
            }
          });
        });
      }

      grid.appendChild(card);
    });
  }

  /* ===================== 検索・フィルタ ===================== */
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    renderGrid();
  });

  /* ===================== モーダル：登録／編集 ===================== */
  function bindImageDropClick() {
    imageDrop.onclick = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
      inp.addEventListener('change', handleImageSelect);
      document.body.appendChild(inp);
      inp.click();
      // 選択ダイアログを閉じた後、要らなくなった一時input要素を掃除する
      inp.addEventListener('change', () => setTimeout(() => inp.remove(), 0), { once: true });
    };
  }

  function resetModalFields() {
    pendingImageFile = null;
    editTags = [];
    titleInput.value = '';
    promptInput.value = '';
    negativeInput.value = '';
    tagInput.value = '';
    imageDrop.classList.remove('has-image');
    imageDrop.innerHTML = '<span>クリックして画像を選択</span>';
    bindImageDropClick();
    renderTagInputRow();
    renderFreqTagPicker();
  }

  function handleImageSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('画像ファイルを選択してください');
      return;
    }
    pendingImageFile = file;
    const url = URL.createObjectURL(file);
    imageDrop.classList.add('has-image');
    imageDrop.innerHTML = `<img src="${url}" alt="preview">`;
    bindImageDropClick();
  }

  function renderTagInputRow() {
    tagInputRow.querySelectorAll('.tag-pill-edit').forEach(el => el.remove());
    editTags.forEach((tag, idx) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill-edit';
      const css = tagColorCss(tag);
      if (css) pill.setAttribute('style', css);
      pill.innerHTML = `${escapeHtml(tag)} <button type="button" data-idx="${idx}">✕</button>`;
      pill.querySelector('button').addEventListener('click', () => {
        editTags.splice(idx, 1);
        renderTagInputRow();
      });
      tagInputRow.insertBefore(pill, tagInput);
    });
  }

  tagInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = tagInput.value.trim();
      if (val && !editTags.includes(val)) {
        editTags.push(val);
        renderTagInputRow();
      }
      tagInput.value = '';
    }
  });

  function openAddModal() {
    editingId = null;
    resetModalFields();
    modalTitle.textContent = '新規登録';
    modalOverlay.classList.add('is-open');
    titleInput.focus();
  }

  function openEditModal(entry) {
    editingId = entry.id;
    resetModalFields();
    modalTitle.textContent = '編集';
    titleInput.value = entry.title || '';
    promptInput.value = entry.prompt || '';
    negativeInput.value = entry.negative || '';
    editTags = [...(entry.tags || [])];
    renderTagInputRow();
    renderFreqTagPicker();
    if (entry.image) {
      const url = makeObjectUrl(entry.image);
      imageDrop.classList.add('has-image');
      imageDrop.innerHTML = `<img src="${url}" alt="preview">`;
      bindImageDropClick();
    }
    modalOverlay.classList.add('is-open');
  }

  function closeModal() {
    modalOverlay.classList.remove('is-open');
    editingId = null;
    pendingImageFile = null;
  }

  addBtn.addEventListener('click', openAddModal);
  modalCloseBtn.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  saveBtn.addEventListener('click', async () => {
    const title = titleInput.value.trim();
    const prompt = promptInput.value.trim();
    const negative = negativeInput.value.trim();

    // フールプルーフ：タイトル・画像いずれも未指定の状態での保存を防ぐ
    // （新規登録時は画像必須、編集時は既存画像があれば省略可）
    let imageBlob = null;
    if (pendingImageFile) {
      imageBlob = pendingImageFile;
    } else if (editingId) {
      const existing = entries.find(e => e.id === editingId);
      imageBlob = existing ? existing.image : null;
    }

    if (!imageBlob) {
      showToast('画像を選択してください');
      return;
    }
    if (!title) {
      showToast('タイトルを入力してください');
      return;
    }

    const entry = {
      id: editingId || ('e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
      title,
      prompt,
      negative,
      tags: [...editTags],
      image: imageBlob,
      createdAt: editingId ? (entries.find(e => e.id === editingId)?.createdAt || Date.now()) : Date.now(),
    };

    try {
      await dbPut(entry);
      showToast(editingId ? '更新しました' : '登録しました');
      closeModal();
      await loadAndRender();
    } catch (err) {
      console.error(err);
      showToast('保存に失敗しました');
    }
  });

  /* ===================== 削除確認（単数／複数の両方で使う） ===================== */
  let pendingDeleteIds = null; // 配列で保持。単一削除も複数削除も同じ経路を通す

  function openConfirmDelete(id) {
    pendingDeleteIds = [id];
    confirmMsg.textContent = 'この登録を削除します。画像・プロンプトは復元できません。よろしいですか？';
    confirmOverlay.classList.add('is-open');
  }
  function openConfirmDeleteMultiple(ids) {
    pendingDeleteIds = ids;
    confirmMsg.textContent = `選択した${ids.length}件を削除します。画像・プロンプトは復元できません。よろしいですか？`;
    confirmOverlay.classList.add('is-open');
  }
  function closeConfirmDelete() {
    pendingDeleteIds = null;
    confirmOverlay.classList.remove('is-open');
  }
  confirmCancelBtn.addEventListener('click', closeConfirmDelete);
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) closeConfirmDelete(); });
  confirmDeleteBtn.addEventListener('click', async () => {
    if (!pendingDeleteIds || pendingDeleteIds.length === 0) return;
    try {
      for (const id of pendingDeleteIds) {
        await dbDelete(id);
      }
      showToast(pendingDeleteIds.length > 1 ? `${pendingDeleteIds.length}件削除しました` : '削除しました');
    } catch (err) {
      console.error(err);
      showToast('削除に失敗しました');
    } finally {
      const wasMultiple = pendingDeleteIds.length > 1;
      closeConfirmDelete();
      if (wasMultiple) exitSelectMode(); // 選択削除モードも終了して通常表示に戻す
      await loadAndRender();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (confirmOverlay.classList.contains('is-open')) closeConfirmDelete();
      else if (modalOverlay.classList.contains('is-open')) closeModal();
      else if (freqTagModalOverlay.classList.contains('is-open')) closeFreqTagModal();
      else if (tagColorModalOverlay.classList.contains('is-open')) closeTagColorModal();
      else if (menuPanel.classList.contains('is-open') || selectModeMenuPanel.classList.contains('is-open')) closeMenu();
    }
  });

  /* ===================== ハンバーガーメニュー：一覧の開閉 ===================== */
  // 通常時はmenuPanel（よく使うタグ／タグの色／選択して削除）、
  // 選択削除モード中はselectModeMenuPanel（モード解除／削除）に差し替える。
  function activeMenuPanel() {
    return selectMode ? selectModeMenuPanel : menuPanel;
  }
  function openMenu() {
    activeMenuPanel().classList.add('is-open');
    hamburgerBtn.classList.add('is-active');
  }
  function closeMenu() {
    menuPanel.classList.remove('is-open');
    selectModeMenuPanel.classList.remove('is-open');
    hamburgerBtn.classList.remove('is-active');
  }
  hamburgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeMenuPanel().classList.contains('is-open')) closeMenu(); else openMenu();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap') && (menuPanel.classList.contains('is-open') || selectModeMenuPanel.classList.contains('is-open'))) {
      closeMenu();
    }
  });

  /* ===================== メニュー項目：よく使うタグモーダル ===================== */
  function openFreqTagModal() {
    closeMenu();
    renderFreqTagList();
    freqTagModalOverlay.classList.add('is-open');
  }
  function closeFreqTagModal() { freqTagModalOverlay.classList.remove('is-open'); }
  menuItemFreqTags.addEventListener('click', openFreqTagModal);
  freqTagModalCloseBtn.addEventListener('click', closeFreqTagModal);
  freqTagModalOverlay.addEventListener('click', (e) => { if (e.target === freqTagModalOverlay) closeFreqTagModal(); });

  function renderFreqTagList() {
    freqTagList.innerHTML = '';
    if (frequentTags.length === 0) {
      freqTagList.innerHTML = '<div class="menu-empty-hint">まだ登録されていません。上の欄にタグ名を入力して追加してください。</div>';
    } else {
      frequentTags.forEach((tag, idx) => {
        const row = document.createElement('div');
        row.className = 'freq-tag-row';
        row.innerHTML = `<span class="ftr-name">${escapeHtml(tag)}</span>`;
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '✕';
        delBtn.title = '「よく使うタグ」から削除（既存の登録データ自体は消えません）';
        delBtn.addEventListener('click', async () => {
          frequentTags.splice(idx, 1);
          await dbSetSetting('frequentTags', frequentTags);
          renderFreqTagList();
          renderFreqTagPicker();
        });
        row.appendChild(delBtn);
        freqTagList.appendChild(row);
      });
    }
  }

  async function addFrequentTag() {
    const val = freqTagAddInput.value.trim();
    if (!val) return;
    if (frequentTags.includes(val)) {
      showToast('すでに登録されています');
      freqTagAddInput.value = '';
      return;
    }
    frequentTags.push(val);
    await dbSetSetting('frequentTags', frequentTags);
    freqTagAddInput.value = '';
    renderFreqTagList();
    renderFreqTagPicker();
  }
  freqTagAddBtn.addEventListener('click', addFrequentTag);
  freqTagAddInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addFrequentTag(); }
  });

  // 登録・編集モーダル内、タグ入力欄の下に「よく使うタグ」をワンクリックで追加できる形で表示する。
  // 絞り込みチップと同じ配色ルール：選択中(active)のときだけ設定色を反映し、
  // 未選択のときは通常のチップと同じ見た目（白字・白枠）にする。
  function renderFreqTagPicker() {
    freqTagPicker.innerHTML = '';
    frequentTags.forEach(tag => {
      const isActive = editTags.includes(tag);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (isActive ? ' active' : '');
      chip.textContent = tag;
      const color = tagColors[tag];
      if (color && isActive) {
        chip.style.borderColor = color;
        chip.style.color = color;
        chip.style.background = 'transparent';
      }
      chip.addEventListener('click', () => {
        if (editTags.includes(tag)) {
          editTags = editTags.filter(t => t !== tag);
        } else {
          editTags.push(tag);
        }
        renderTagInputRow();
        renderFreqTagPicker();
      });
      freqTagPicker.appendChild(chip);
    });
  }

  /* ===================== メニュー項目：タグの色モーダル ===================== */
  function openTagColorModal() {
    closeMenu();
    renderTagColorList();
    tagColorModalOverlay.classList.add('is-open');
  }
  function closeTagColorModal() { tagColorModalOverlay.classList.remove('is-open'); }
  menuItemTagColors.addEventListener('click', openTagColorModal);
  tagColorModalCloseBtn.addEventListener('click', closeTagColorModal);
  tagColorModalOverlay.addEventListener('click', (e) => { if (e.target === tagColorModalOverlay) closeTagColorModal(); });

  // 色設定の対象は「現在使われている全タグ」＋「よく使うタグ登録分」の和集合。
  // 一度も使われていない色設定だけが残り続けることを避けるため、
  // 実際に使われなくなったタグの色は一覧描画時に自然に表示されなくなる
  // （tagColorsのデータ自体は消さず、同名タグが復活すれば色も復元される）。
  function getColorablesTags() {
    const set = new Set([...getAllTags(), ...frequentTags]);
    return Array.from(set).sort();
  }

  function renderTagColorList() {
    const tags = getColorablesTags();
    tagColorList.innerHTML = '';
    if (tags.length === 0) {
      tagColorList.innerHTML = '<div class="menu-empty-hint">タグを登録すると、ここで色を設定できるようになります。</div>';
      return;
    }
    tags.forEach(tag => {
      const row = document.createElement('div');
      row.className = 'tag-color-row';
      const current = tagColors[tag] || '#00f0d0';
      row.innerHTML = `
        <span class="tcr-name">${escapeHtml(tag)}</span>
        <span class="tcr-controls">
          <input type="color" value="${current}" data-tag="${escapeHtml(tag)}">
          <button type="button" class="tcr-reset" data-tag="${escapeHtml(tag)}">既定に戻す</button>
        </span>
      `;
      const colorInput = row.querySelector('input[type="color"]');
      colorInput.addEventListener('input', async () => {
        tagColors[tag] = colorInput.value;
        await dbSetSetting('tagColors', tagColors);
        renderGrid();
        renderTagChips();
      });
      row.querySelector('.tcr-reset').addEventListener('click', async () => {
        delete tagColors[tag];
        await dbSetSetting('tagColors', tagColors);
        renderTagColorList();
        renderGrid();
        renderTagChips();
      });
      tagColorList.appendChild(row);
    });
  }

  /* ===================== メニュー項目：選択削除モード ===================== */
  function setSelectModeUiLock(locked) {
    searchInput.disabled = locked;
    addBtn.disabled = locked;
    addBtn.style.opacity = locked ? '.4' : '';
    addBtn.style.pointerEvents = locked ? 'none' : '';
    tagChips.style.opacity = locked ? '.4' : '';
    tagChips.style.pointerEvents = locked ? 'none' : '';
  }

  function enterSelectMode() {
    selectMode = true;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.add('is-active');
    setSelectModeUiLock(true);
    renderGrid();
  }
  function exitSelectMode() {
    selectMode = false;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.remove('is-active');
    setSelectModeUiLock(false);
    renderGrid();
  }
  function toggleSelectForDelete(id) {
    if (selectedForDelete.has(id)) selectedForDelete.delete(id);
    else selectedForDelete.add(id);
    renderGrid();
  }
  menuItemSelectMode.addEventListener('click', enterSelectMode);
  menuItemExitSelect.addEventListener('click', exitSelectMode);
  menuItemDeleteSelected.addEventListener('click', () => {
    closeMenu();
    if (selectedForDelete.size === 0) {
      showToast('削除する項目を選択してください');
      return;
    }
    openConfirmDeleteMultiple(Array.from(selectedForDelete));
  });

  /* ===================== 初期化 ===================== */
  bindImageDropClick();
  openDb().then(async (_db) => {
    db = _db;
    const savedFreqTags = await dbGetSetting('frequentTags');
    const savedTagColors = await dbGetSetting('tagColors');
    frequentTags = Array.isArray(savedFreqTags) ? savedFreqTags : [];
    tagColors = (savedTagColors && typeof savedTagColors === 'object') ? savedTagColors : {};
    await loadAndRender();
  }).catch((err) => {
    console.error('IndexedDBの初期化に失敗しました', err);
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="big">保存機能を利用できません</div>
      <div class="small">このブラウザ／モードではIndexedDBが利用できないため、登録内容は保存されません。プライベートブラウジングモードなどをご確認ください。</div>
    </div>`;
  });
})();
</script>
</body>
</html>
