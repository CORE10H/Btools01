<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discotica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --bg-alt: #070b10;
    --panel: #0e1620;
    --panel-hi: #121d29;
    --line: #1e3038;
    --line-soft: #14212a;
    --cyan: #00f0d0;
    --cyan-dim: #0a4a44;
    --magenta: #ff2f6e;
    --magenta-dim: #4a0f24;
    --amber: #ffb020;
    --text: #f5f9fa;
    --text-dim: #b8c4cc;
    --text-faint: #5c6b73;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'IBM Plex Sans JP', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
  button, input, textarea { font-family: inherit; color: inherit; }
  ::selection { background: var(--cyan); color: #000; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }

  .app-shell { height: 100%; display: flex; flex-direction: column; position: relative; }

  /* ---- top bar ---- */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .app-bar .app-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); letter-spacing: .04em; white-space: nowrap; }
  .app-bar .app-title span { color: var(--text-faint); font-size: 11px; margin-left: 8px; }

  .btn {
    font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--line); padding: 6px 12px;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary:hover { background: var(--cyan-dim); }
  .btn.danger { border-color: var(--magenta-dim); color: var(--magenta); }
  .btn.danger:hover { background: var(--magenta-dim); }

  /* ===================== TOP: アーティスト一覧（縦型カバーフロー） ===================== */
  .app-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }

  /* 横型リング（3Dカルーセル、2026-09-24）。リングの直径はカード幅の約2.6倍に
     なるため、左右のボタンがカードに被らないよう枠の最大幅を広げている。
     見下ろす角度はJS側でトラックに rotateX を掛けて作る（視点位置はずらさない） */
  .artist-cf-wrap {
    position: relative; width: 100%; max-width: 860px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    perspective: 1000px; perspective-origin: 50% 50%;
    overflow: hidden;
  }
  /* 中央カード連動の背景（2026-09-25）：センターのカバー画像を拡大・減彩して
     敷く。2枚を交互に使うクロスフェード方式（片方が消えながらもう片方が
     浮かぶ）で、切り替わりの一瞬にも背景が途切れない。
     リングのカード（is-centerや.artist-cf-item）より手前に来ないよう、
     wrap内の一番最初、z-indexも最背面に置く */
  .artist-bg-layer {
    position: absolute; inset: -5%; z-index: 0;
    background-size: cover; background-position: center;
    filter: saturate(.35) brightness(.4) blur(2px);
    opacity: 0; transition: opacity .7s ease;
    pointer-events: none;
  }
  .artist-bg-layer.is-visible { opacity: 1; }
  .artist-cf-track { z-index: 1; }
  .artist-cf-track {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.22, .61, .36, 1);
  }
  /* データ読み直し直後など、回転アニメーションを出したくない瞬間だけ付ける */
  .artist-cf-track.no-anim,
  .artist-cf-track.no-anim .artist-cf-item { transition: none !important; }
  .artist-cf-item {
    /* 幅は画面幅に連動（スマホでも両隣のカードが画面内に収まる大きさ）。
       リングの半径はJSがこの実際の幅から計算する */
    position: absolute; top: 50%; left: 50%; width: min(300px, 42vw); aspect-ratio: 16/9;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: flex-end; overflow: hidden;
    background-size: cover; background-position: center;
    transition: opacity .35s ease;
    cursor: pointer;
  }
  .artist-cf-item.is-center { border-color: var(--cyan-dim); }
  /* リングの奥側（背中をこちらに向けているカード）：暗く沈め、鏡文字になる名前は隠す */
  .artist-cf-item.is-back { opacity: .32; }
  .artist-cf-item.is-back .artist-name-plate { visibility: hidden; }
  /* 件数が面数より多いとき、真裏付近で重なるカード */
  .artist-cf-item.is-hidden { opacity: 0; pointer-events: none; }
  .artist-cf-item.empty { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 32px; font-family: var(--font-display); }
  /* NOW MASTERINGダミーカード（2026-09-24）：リングを常に成立させるための
     頭数埋め。「＋追加する」と同じクリック導線だが、無地の点滅ラベルのみで
     実データと見分けがつくようにする */
  .artist-cf-item.dummy { display: flex; align-items: center; justify-content: center; border-style: dashed; }
  .artist-name-plate.dummy-plate {
    position: static; width: auto; padding: 0; background: none;
    font-size: 11px; letter-spacing: .12em; color: var(--text-faint);
    animation: dummy-blink 1.8s ease-in-out infinite;
  }
  @keyframes dummy-blink { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
  .artist-name-plate {
    width: 100%; padding: 10px 14px 12px;
    background: linear-gradient(0deg, rgba(5,7,10,.92), transparent);
    font-family: var(--font-display); font-size: 15px; letter-spacing: .03em; color: var(--text);
  }

  /* 横型リング化（2026-09-24）：▲▼の上下配置から◀▶の左右配置に変更 */
  .cf-nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 26px; height: 34px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text-dim); font-size: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  .cf-nav-btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .cf-nav-btn.prev { left: 2%; }
  .cf-nav-btn.next { right: 2%; }

  /* ===================== モーダル共通（アーティスト詳細／アルバム詳細） ===================== */
  .view-overlay {
    position: fixed; inset: 0; background: rgba(2,3,5,.88); display: none;
    align-items: stretch; justify-content: center; z-index: 50;
  }
  .view-overlay.is-open { display: flex; }
  .view-panel {
    width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  .view-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .view-head .vh-titles { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .view-head .vh-eyebrow { font-size: 10px; color: var(--text-faint); letter-spacing: .06em; }
  .view-head .vh-title { font-family: var(--font-display); font-size: 18px; color: var(--text); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-head .vh-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .view-close {
    width: 28px; height: 28px; background: transparent; border: 1px solid var(--line); color: var(--text-faint); font-size: 14px;
  }
  .view-close:hover { border-color: var(--magenta); color: var(--magenta); }

  .view-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px; }

  /* ---- アーティスト概要欄 ---- */
  .artist-bio-block { display: flex; gap: 18px; align-items: flex-start; }
  .artist-bio-cover {
    width: 160px; aspect-ratio: 16/9; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line);
    background-size: cover; background-position: center;
  }
  .artist-bio-text { flex: 1; min-width: 0; }
  .artist-bio-text textarea {
    width: 100%; min-height: 90px; background: var(--bg-alt); border: 1px solid var(--line);
    padding: 10px; font-size: 12px; color: var(--text-dim); line-height: 1.7; outline: none; resize: vertical;
  }
  .artist-bio-text textarea:focus { border-color: var(--cyan-dim); }
  .bio-save-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .bio-save-row .btn { font-size: 10px; padding: 4px 10px; }

  .section-label {
    font-family: var(--font-display); font-size: 12px; color: var(--text-faint); letter-spacing: .08em;
    padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
  }

  /* ===================== Discography / 楽曲 共通カバーフロー（横型グリッド流し） ===================== */
  .h-cf-wrap { position: relative; }
  .h-cf-track {
    display: flex; gap: 14px; overflow-x: auto; padding: 6px 2px 14px;
    scroll-behavior: smooth;
  }
  .h-cf-track::-webkit-scrollbar { height: 6px; }
  .h-cf-track::-webkit-scrollbar-thumb { background: var(--line); }
  .h-cf-track::-webkit-scrollbar-track { background: transparent; }

  .album-card, .track-card {
    position: relative; flex: 0 0 200px; aspect-ratio: 16/9; background: var(--panel);
    border: 1px solid var(--line); overflow: hidden; cursor: pointer;
    background-size: cover; background-position: center;
  }
  .album-card.add-card, .track-card.add-card {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    color: var(--text-faint); font-size: 11px; border-style: dashed;
  }
  .album-card.add-card:hover, .track-card.add-card:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .add-card .plus-icon { font-family: var(--font-display); font-size: 22px; line-height: 1; }

  .album-title-plate, .track-title-plate {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px 9px;
    background: linear-gradient(0deg, rgba(5,7,10,.9), transparent);
    font-size: 11.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    pointer-events: none;
  }

  /* ---- アルバムホバー：収録曲ポップアップ ---- */
  .album-pop {
    position: absolute; inset: 0; background: rgba(5,7,10,.85);
    display: flex; flex-direction: column; padding: 10px; gap: 4px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease; overflow-y: auto;
  }
  .album-card:hover .album-pop { opacity: 1; }
  .album-pop .ap-label { font-family: var(--font-display); font-size: 9px; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 4px; }
  .album-pop .ap-track { font-size: 10.5px; color: var(--text-dim); padding: 2px 0; line-height: 1.4; }
  .album-pop .ap-empty { font-size: 10px; color: var(--text-faint); font-style: italic; }

  /* ---- 楽曲ホバー：歌詞・説明ポップアップ ---- */
  .track-pop {
    position: absolute; inset: 0; background: rgba(5,7,10,.88);
    display: flex; flex-direction: column; padding: 10px; gap: 6px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease; overflow-y: auto;
  }
  .track-card:hover .track-pop { opacity: 1; }
  .track-pop .tp-label { font-family: var(--font-display); font-size: 9px; letter-spacing: .06em; color: var(--text-faint); }
  .track-pop .tp-text { font-size: 10px; line-height: 1.5; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; }
  .track-pop .tp-empty { font-size: 9.5px; color: var(--text-faint); font-style: italic; }

  /* ---- 再生状態インジケータ ---- */
  .track-card.is-playing { border-color: var(--cyan); }
  .track-play-badge {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
    background: rgba(5,7,10,.75); border: 1px solid var(--cyan); color: var(--cyan);
    display: none; align-items: center; justify-content: center; font-size: 10px; z-index: 2;
  }
  .track-card.is-playing .track-play-badge { display: flex; }
  .track-card:not(.add-card):hover .track-play-badge { display: flex; }

  /* ---- 削除ボタン（各カード左上、ホバー時のみ） ---- */
  .card-del-btn {
    position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; z-index: 3;
    background: rgba(5,7,10,.75); border: 1px solid var(--line); color: var(--text-dim);
    font-size: 11px; display: none; align-items: center; justify-content: center;
  }
  .album-card:hover .card-del-btn, .track-card:hover .card-del-btn { display: flex; }
  .card-del-btn:hover { border-color: var(--magenta); color: var(--magenta); background: var(--magenta-dim); }

  /* ---- ミニプレイヤーバー（アルバム詳細画面内） ---- */
  .mini-player {
    display: none; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--panel-hi); border: 1px solid var(--cyan-dim); flex-shrink: 0;
  }
  .mini-player.is-active { display: flex; }
  .mini-player .mp-info { flex: 1; min-width: 0; }
  .mini-player .mp-track { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-player .mp-artist { font-size: 10px; color: var(--text-faint); }
  .mini-player .mp-stop { font-size: 10px; padding: 5px 10px; }

  /* ===================== 登録/編集モーダル（アーティスト・アルバム・楽曲共通シェル） ===================== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 80; padding: 20px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); padding: 18px 20px 20px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
  }
  .modal-head .modal-title { font-family: var(--font-display); font-size: 13px; color: var(--text); letter-spacing: .04em; }
  .modal-close { width: 22px; height: 22px; background: transparent; border: 1px solid var(--line); color: var(--text-faint); font-size: 12px; }
  .modal-close:hover { border-color: var(--magenta); color: var(--magenta); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 10px; color: var(--text-faint); letter-spacing: .04em; margin-bottom: 5px; }
  .field input[type="text"], .field input[type="url"], .field textarea {
    width: 100%; background: var(--bg-alt); border: 1px solid var(--line); padding: 8px 9px;
    font-size: 12px; color: var(--text); outline: none; resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--cyan-dim); }
  .field textarea { min-height: 60px; line-height: 1.5; }
  .field-hint { font-size: 9.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
  .field-radio-row { display: flex; gap: 14px; margin-bottom: 8px; }
  .field-radio-row label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); margin-bottom: 0; cursor: pointer; }
  .field-radio-row input[type="radio"] { accent-color: var(--cyan); }

  .image-drop {
    border: 1px dashed var(--line); padding: 14px; text-align: center; cursor: pointer;
    color: var(--text-faint); font-size: 11px; position: relative; overflow: hidden;
    min-height: 70px; display: flex; align-items: center; justify-content: center;
  }
  .image-drop:hover { border-color: var(--cyan-dim); }
  .image-drop.has-image { padding: 0; }
  .image-drop img { width: 100%; max-height: 160px; object-fit: contain; display: block; }
  .image-drop input[type="file"] { display: none; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--panel); border: 1px solid var(--cyan-dim); color: var(--cyan);
    font-size: 11px; padding: 8px 16px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 90;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- confirm dialog ---- */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 95; padding: 20px;
  }
  .confirm-overlay.is-open { display: flex; }
  .confirm-box {
    width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--magenta-dim); padding: 16px 18px;
  }
  .confirm-box .cf-msg { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 14px; }
  .confirm-box .cf-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .empty-state {
    text-align: center; color: var(--text-faint); padding: 30px 20px; font-size: 11.5px; line-height: 1.8;
  }
</style>
</head>
<body>
<div class="app-shell">

  <div class="app-bar">
    <span class="app-title">Discotica<span>音楽プロジェクト・アーカイブ</span></span>
  </div>

  <!-- ① Top: アーティスト一覧（横型リング・2026-09-24変更。旧：縦型カバーフロー） -->
  <div class="app-body">
    <div class="artist-cf-wrap">
      <div class="artist-bg-layer" id="artistBgLayerA"></div>
      <div class="artist-bg-layer" id="artistBgLayerB"></div>
      <button class="cf-nav-btn prev" id="artistPrevBtn">◀</button>
      <div class="artist-cf-track" id="artistTrack"></div>
      <button class="cf-nav-btn next" id="artistNextBtn">▶</button>
    </div>
  </div>

  <!-- ② アーティスト詳細モーダル -->
  <div class="view-overlay" id="artistViewOverlay">
    <div class="view-panel">
      <div class="view-head">
        <div class="vh-titles">
          <span class="vh-eyebrow">ARTIST</span>
          <span class="vh-title" id="artistViewTitle"></span>
        </div>
        <div class="vh-actions">
          <button class="btn danger" id="artistDeleteBtn">アーティストを削除</button>
          <button class="view-close" id="artistViewCloseBtn">✕</button>
        </div>
      </div>
      <div class="view-body">
        <div class="artist-bio-block">
          <div class="artist-bio-cover" id="artistBioCover"></div>
          <div class="artist-bio-text">
            <textarea id="artistBioInput" placeholder="アーティストの概要・コンセプトなど"></textarea>
            <div class="bio-save-row"><button class="btn" id="artistBioSaveBtn">概要を保存</button></div>
          </div>
        </div>
        <div>
          <div class="section-label">DISCOGRAPHY</div>
          <div class="h-cf-wrap">
            <div class="h-cf-track" id="albumTrack"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ③ アルバム詳細モーダル -->
  <div class="view-overlay" id="albumViewOverlay">
    <div class="view-panel">
      <div class="view-head">
        <div class="vh-titles">
          <span class="vh-eyebrow" id="albumViewEyebrow">ALBUM</span>
          <span class="vh-title" id="albumViewTitle"></span>
        </div>
        <div class="vh-actions">
          <button class="btn danger" id="albumDeleteBtn">アルバムを削除</button>
          <button class="view-close" id="albumViewCloseBtn">✕</button>
        </div>
      </div>
      <div class="view-body">
        <div class="mini-player" id="miniPlayer">
          <div class="mp-info">
            <div class="mp-track" id="mpTrackName"></div>
            <div class="mp-artist" id="mpArtistName"></div>
          </div>
          <button class="btn mp-stop" id="mpStopBtn">■ 停止</button>
        </div>
        <div class="h-cf-wrap">
          <div class="h-cf-track" id="trackTrack"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 登録/編集モーダル：アーティスト -->
  <div class="modal-overlay" id="artistModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">アーティストを追加</span>
        <button class="modal-close" id="artistModalCloseBtn">✕</button>
      </div>
      <div class="field">
        <label>アーティスト画像（任意）</label>
        <div class="image-drop" id="artistImageDrop">
          <span id="artistImageDropText">クリックして画像を選択</span>
          <input type="file" id="artistImageInput" accept="image/*">
        </div>
      </div>
      <div class="field">
        <label>アーティスト名</label>
        <input type="text" id="artistNameInput" maxlength="60" placeholder="アーティスト名を入力">
      </div>
      <div class="field">
        <label>概要（任意・後からでも編集可）</label>
        <textarea id="artistBioModalInput" placeholder="コンセプトや説明など"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="artistModalCancelBtn">キャンセル</button>
        <button class="btn primary" id="artistModalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 登録/編集モーダル：アルバム -->
  <div class="modal-overlay" id="albumModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="albumModalTitle">アルバムを追加</span>
        <button class="modal-close" id="albumModalCloseBtn">✕</button>
      </div>
      <div class="field">
        <label>ジャケ写（16:9）</label>
        <div class="image-drop" id="albumImageDrop">
          <span id="albumImageDropText">クリックして画像を選択</span>
          <input type="file" id="albumImageInput" accept="image/*">
        </div>
        <div class="field-hint">16:9の画像を推奨します（それ以外の比率の場合は中央でトリミング表示されます）。</div>
      </div>
      <div class="field">
        <label>アルバムタイトル</label>
        <input type="text" id="albumTitleInput" maxlength="60" placeholder="例：紅蓮のワルツ">
      </div>
      <div class="field-hint" style="margin-bottom:12px;">収録曲は保存後、アルバム詳細画面から追加できます。</div>
      <div class="modal-footer">
        <button class="btn" id="albumModalCancelBtn">キャンセル</button>
        <button class="btn primary" id="albumModalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 登録/編集モーダル：楽曲 -->
  <div class="modal-overlay" id="trackModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="trackModalTitle">楽曲を追加</span>
        <button class="modal-close" id="trackModalCloseBtn">✕</button>
      </div>
      <div class="field">
        <label>楽曲タイトル</label>
        <input type="text" id="trackTitleInput" maxlength="80" placeholder="例：紅蓮のワルツ（Track 1）">
      </div>
      <div class="field">
        <label>音源</label>
        <div class="field-radio-row">
          <label><input type="radio" name="audioType" value="url" checked> 外部URL</label>
          <label><input type="radio" name="audioType" value="file" disabled> ファイルアップロード（準備中）</label>
        </div>
        <input type="url" id="trackAudioUrlInput" placeholder="https://example.com/track.mp3">
        <div class="field-hint">現バージョンでは外部URLのみ対応しています。ファイルアップロードは今後追加予定です。</div>
      </div>
      <div class="field">
        <label>歌詞（任意）</label>
        <textarea id="trackLyricsInput" placeholder="歌詞を入力（ホバー時にポップアップ表示されます）"></textarea>
      </div>
      <div class="field">
        <label>説明（任意）</label>
        <textarea id="trackDescInput" placeholder="制作背景・楽曲説明など"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="trackModalCancelBtn">キャンセル</button>
        <button class="btn primary" id="trackModalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 削除確認 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="cf-msg" id="confirmMsg"></div>
      <div class="cf-actions">
        <button class="btn" id="confirmCancelBtn">キャンセル</button>
        <button class="btn danger" id="confirmDeleteBtn">削除する</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="discotica.js"></script>
</body>
</html>
