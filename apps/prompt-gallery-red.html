<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像生成プロンプト見本一覧 RED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --bg-alt: #070b10;
    --panel: #0e1620;
    --panel-hi: #121d29;
    --line: #1e3038;
    --line-soft: #14212a;
    --cyan: #00f0d0;
    --cyan-dim: #0a4a44;
    /* PROMPTGALLERY RED 固有の強調色。テーマブリッジには追従させない固定値（アプリ固有の色） */
    --brand-accent: #ff2d3c;
    --brand-accent-dim: #4a0a10;
    --brand-accent-rgb: 255, 45, 60;
    --magenta: #ff2f6e;
    --magenta-dim: #4a0f24;
    --amber: #ffb020;
    --text: #f5f9fa;
    --text-dim: #b8c4cc;
    --text-faint: #5c6b73;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'IBM Plex Sans JP', sans-serif;
    /* --- テーマ連携用（本体から上書きされる。単体表示時はこの既定値） --- */
    --bg-rgb: 5, 7, 10;
    --panel-rgb: 14, 22, 32;
    --cyan-rgb: 0, 240, 208;
    --magenta-rgb: 255, 47, 110;
    --magenta-dim-rgb: 74, 15, 36;
    --text-rgb: 245, 249, 250;
    --scrim-rgb: 0, 0, 0;
    --shadow-rgb: 0, 0, 0;
    --on-accent: #000000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  button, input, textarea { font-family: inherit; color: inherit; }
  ::selection { background: var(--brand-accent); color: var(--on-accent); }

  .app-shell { height: 100%; display: flex; flex-direction: column; }

  /* ---- top bar ---- */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .app-bar .app-title { font-family: var(--font-display); font-size: 13px; color: var(--brand-accent); letter-spacing: .04em; white-space: nowrap; }
  .bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-alt); border: 1px solid var(--line); padding: 5px 10px;
    min-width: 0;
  }
  .search-box input {
    background: transparent; border: none; outline: none; font-size: 12px; color: var(--text);
    width: 140px;
  }
  .search-box input::placeholder { color: var(--text-faint); }
  /* ヘッダー高さの固定化（2026-09-25）：以前はflex-wrapで折り返していたため、
     登録タグが増えるほどヘッダーの高さが変わってしまっていた。
     nowrap + overflow: hidden で「入るだけ並べる」構造にし、収まらない分は
     「+n」ボタン1個にまとめてモーダルへ逃がす（renderTagChips参照）。
     これにより見えている領域の高さが常に一定になる */
  .tag-filter-chips {
    display: flex; gap: 5px; flex-wrap: nowrap; overflow: hidden; max-width: 260px;
  }
  .bar-filter { display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* 狭い画面（スマホの縦向きなど）では1段に収まらず、検索欄が「＋」ボタンに重なっていた。
     2段にする（2026-10-06）：1段目＝タイトル・追加ボタン・☰、2段目＝検索欄とタグ。
     .bar-right を display: contents にして、中身を .app-bar の並びに直接参加させる */
  @media (max-width: 640px) {
    .app-bar { flex-wrap: wrap; row-gap: 8px; column-gap: 8px; padding: 8px 12px; }
    .app-bar .app-title { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .bar-right { display: contents; }
    .bar-filter { order: 1; flex: 1 1 100%; }
    .search-box { flex: 1 1 120px; max-width: 240px; }
    .search-box input { flex: 1 1 0; width: 0; min-width: 0; }
    .tag-filter-chips { flex: 1 1 0; max-width: none; min-width: 0; }
  }
  .chip {
    font-size: 10px; padding: 3px 8px; border: 1px solid var(--line); color: var(--text-dim);
    cursor: pointer; white-space: nowrap; background: transparent; flex-shrink: 0;
  }
  .chip.active { border-color: var(--brand-accent); color: var(--brand-accent); background: var(--brand-accent-dim); }
  .chip-more { border-style: dashed; color: var(--text-faint); }
  .chip-more:hover { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .tag-more-list { display: flex; flex-direction: column; gap: 6px; }
  .tag-more-list .chip { width: 100%; text-align: left; box-sizing: border-box; }

  .btn {
    font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .btn.primary { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .btn.primary:hover { background: var(--brand-accent-dim); }
  .btn.danger { border-color: var(--magenta-dim); color: var(--magenta); }
  .btn.danger:hover { background: var(--magenta-dim); }

  /* ---- hamburger menu ---- */
  .menu-wrap { position: relative; flex-shrink: 0; }
  .hamburger-btn {
    width: 30px; height: 30px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hamburger-btn:hover, .hamburger-btn.is-active { border-color: var(--brand-accent-dim); color: var(--brand-accent); }

  /* ---- ハンバーガーメニュー：一覧（項目を選ぶだけの軽い画面） ---- */
  .menu-panel {
    position: absolute; top: calc(100% + 6px); right: 0; width: 200px;
    background: var(--panel); border: 1px solid var(--line); z-index: 40; display: none;
    padding: 6px;
  }
  .menu-panel.is-open { display: block; }
  .menu-panel-item {
    width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text-dim); font-size: 12px; padding: 9px 10px; cursor: pointer;
  }
  .menu-panel-item:hover { background: var(--bg-alt); color: var(--brand-accent); }
  .menu-panel-item.danger:hover { color: var(--magenta); }

  /* ---- サブモーダル（よく使うタグ／タグの色／タグで絞り込み） ---- */
  /* 二重スクロールバー対策（2026-09-26）：共通の .modal クラスに
     max-height:90vh; overflow-y:auto があり、そこに .sub-modal-body の
     overflow-y:auto が重なって、内容が増えるとスクロールバーが2本
     並んで出ていた。.sub-modal だけ overflow を hidden にして高さの
     「枠」に徹し、実際のスクロールは .sub-modal-body 1箇所に一本化する。
     .modal は他のモーダル（新規登録／編集）でも使う共通クラスのため、
     ここでは触らず .sub-modal 側で上書きするだけに留める */
  .sub-modal {
    width: 100%; max-width: 340px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .sub-modal .modal-head { flex-shrink: 0; }
  .sub-modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 4px; }
  /* スクロールバーの見た目を細く、パネルの配色に馴染ませる。
     Firefox系は scrollbar-width/scrollbar-color、Chrome/Safari系は
     ::-webkit-scrollbar 系で指定する必要があり、枯れた併記が定番 */
  .sub-modal-body { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .sub-modal-body::-webkit-scrollbar { width: 6px; }
  .sub-modal-body::-webkit-scrollbar-track { background: transparent; }
  .sub-modal-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .sub-modal-body::-webkit-scrollbar-thumb:hover { background: var(--brand-accent-dim); }
  .freq-tag-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .freq-tag-add-row input {
    flex: 1; background: var(--bg-alt); border: 1px solid var(--line); padding: 6px 8px;
    font-size: 11px; color: var(--text); outline: none;
  }
  .freq-tag-add-row input:focus { border-color: var(--brand-accent-dim); }
  .freq-tag-list, .tag-color-list { display: flex; flex-direction: column; gap: 6px; }
  .freq-tag-row, .tag-color-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .freq-tag-row .ftr-name, .tag-color-row .tcr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .freq-tag-row button {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 10px; width: 20px; height: 20px; cursor: pointer; flex-shrink: 0;
  }
  .freq-tag-row button:hover { border-color: var(--magenta-dim); color: var(--magenta); }
  .tag-color-row { flex-shrink: 0; }
  .tag-color-row .tcr-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tag-color-row input[type="color"] {
    width: 26px; height: 22px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 0;
  }
  .tag-color-row .tcr-reset {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 9.5px; padding: 3px 6px; cursor: pointer;
  }
  .tag-color-row .tcr-reset:hover { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .menu-empty-hint { font-size: 10.5px; color: var(--text-faint); line-height: 1.6; }

  /* ---- 「よく使うタグ」チップ（登録・編集モーダル内） ---- */
  .freq-tag-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .freq-tag-picker .chip { font-size: 10px; padding: 3px 8px; }

  /* ---- 選択削除モード ---- */
  .select-mode-hint {
    padding: 8px 16px; background: var(--magenta-dim); border-bottom: 1px solid var(--magenta);
    font-size: 11px; color: var(--text); flex-shrink: 0; display: none;
  }
  .select-mode-hint.is-active { display: block; }
  .card.select-target { cursor: pointer; }
  .card-erase-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(var(--magenta-dim-rgb), .55); border: 2px solid var(--magenta);
  }
  .card-erase-overlay.is-marked { display: flex; }
  .card-erase-overlay .erase-label {
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .06em;
    color: var(--magenta); text-shadow: 0 0 8px rgba(var(--magenta-rgb),.6);
  }

  /* ---- grid ---- */
  .app-body { flex: 1; overflow-y: auto; padding: 18px; min-height: 0; position: relative; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;
  }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--text-faint); flex-direction: column; gap: 10px; padding: 40px;
  }
  .empty-state .big { font-family: var(--font-display); font-size: 13px; color: var(--text-dim); letter-spacing: .04em; }
  .empty-state .small { font-size: 11px; max-width: 320px; line-height: 1.8; }

  .card {
    position: relative; aspect-ratio: 1; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 登録時に「見え方」を決めた画像（entry.thumb）。大きさと位置は applyThumb() が％で指定する */
  .card img.framed, .frame-box img { position: absolute; max-width: none; object-fit: fill; }
  .card-title {
    position: absolute; top: 0; left: 0; right: 0; padding: 7px 9px 14px;
    background: linear-gradient(180deg, rgba(var(--bg-rgb),.88), transparent);
    font-size: 11.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    pointer-events: none;
  }
  .card-tags {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 7px;
    background: linear-gradient(0deg, rgba(var(--bg-rgb),.9), transparent);
    display: flex; gap: 4px; flex-wrap: wrap; pointer-events: none;
  }
  .card-tags .tag-pill {
    font-size: 9px; padding: 2px 6px; background: rgba(var(--brand-accent-rgb),.12); border: 1px solid var(--brand-accent-dim);
    color: var(--brand-accent); white-space: nowrap;
  }
  /* カードの上のメニュー（.prompt-pop）は2026-10-07に廃止。PCもスマホも「クリック（タップ）で拡大 →
     拡大した画像のクリックでメニュー（.lb-menu）」に揃えた。PCではマウスを乗せると枠だけ光らせる */
  @media (hover: hover) and (pointer: fine) {
    .card:not(.select-target):hover { border-color: var(--brand-accent-dim); }
  }

  /* ---- サムネイル拡大ライトボックス（2026-09-25） ----
     画面に収まる範囲でなるべく大きく、原寸は超えない(object-fit: contain
     ではなく、実寸をmax-width/max-heightで上限にして自然サイズを尊重する) */
  .thumb-lightbox {
    position: fixed; inset: 0; background: rgba(var(--scrim-rgb),.86); z-index: 90;
    display: none; align-items: center; justify-content: center; padding: 32px;
  }
  .thumb-lightbox.is-open { display: flex; }
  .thumb-lightbox img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; box-shadow: 0 0 40px rgba(var(--shadow-rgb),.6);
  }
  .thumb-lightbox-close {
    position: absolute; top: 18px; right: 22px; width: 30px; height: 30px;
    background: rgba(var(--bg-rgb),.7); border: 1px solid var(--line); color: var(--text-dim);
    font-size: 14px; cursor: pointer;
  }
  .thumb-lightbox-close:hover { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .thumb-lightbox img { cursor: pointer; }
  /* 拡大した画像をタップすると出るメニュー（2026-10-06）。もう一度タップで隠れる */
  .lb-hint {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    font-size: 10.5px; color: var(--text-dim); background: rgba(var(--bg-rgb),.7);
    border: 1px solid var(--line-soft); padding: 5px 12px; white-space: nowrap; pointer-events: none;
  }
  .lb-hint.is-hidden { display: none; }
  .lb-menu {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(420px, calc(100% - 32px)); background: rgba(var(--bg-rgb),.94);
    border: 1px solid var(--line); padding: 12px; display: none;
    box-shadow: 0 0 30px rgba(var(--shadow-rgb),.6);
  }
  .lb-menu.is-open { display: block; }
  .lb-menu-title {
    font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-menu-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lb-menu .pp-menu-btn {
    font-size: 12px; padding: 10px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer; text-align: center;
  }
  .lb-menu .pp-menu-btn:hover { border-color: var(--brand-accent-dim); color: var(--brand-accent); }
  .lb-menu .pp-menu-btn.copied { border-color: var(--brand-accent); color: var(--brand-accent); background: var(--brand-accent-dim); }
  .lb-menu .pp-menu-btn:disabled { color: var(--text-faint); border-color: var(--line-soft); cursor: default; opacity: .5; }
  .lb-menu .pp-copy { grid-column: 1 / -1; }
  .lb-menu .pp-delete:hover { border-color: var(--magenta-dim); color: var(--magenta); }

  /* ---- modal (add/edit) ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(var(--scrim-rgb),.6); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); padding: 18px 20px 20px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
  }
  .modal-head .modal-title { font-family: var(--font-display); font-size: 13px; color: var(--text); letter-spacing: .04em; }
  .modal-close { width: 22px; height: 22px; background: transparent; border: 1px solid var(--line); color: var(--text-faint); font-size: 12px; cursor: pointer; }
  .modal-close:hover { border-color: var(--magenta); color: var(--magenta); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 10px; color: var(--text-faint); letter-spacing: .04em; margin-bottom: 5px; }
  .field input[type="text"], .field textarea {
    width: 100%; background: var(--bg-alt); border: 1px solid var(--line); padding: 8px 9px;
    font-size: 12px; color: var(--text); outline: none; resize: vertical;
  }
  .field input[type="text"]:focus, .field textarea:focus { border-color: var(--brand-accent-dim); }
  .field textarea { min-height: 60px; line-height: 1.5; }
  .field-hint { font-size: 9.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }

  .image-drop {
    border: 1px dashed var(--line); padding: 14px; text-align: center; cursor: pointer;
    color: var(--text-faint); font-size: 11px; position: relative; overflow: hidden;
    min-height: 90px; display: flex; align-items: center; justify-content: center;
  }
  .image-drop:hover { border-color: var(--brand-accent-dim); }
  .image-drop.has-image { padding: 0; }
  .image-drop img { width: 100%; max-height: 180px; object-fit: contain; display: block; }
  .image-drop input[type="file"] { display: none; }

  /* ---- サムネイルの見え方（枠合わせ）（2026-10-06） ----
     一覧のカードと同じ正方形の枠。ドラッグで位置、ピンチ・ホイール・スライダーで拡大縮小 */
  .frame-editor { display: none; }
  .frame-editor.is-open { display: block; }
  .frame-box {
    position: relative; width: 100%; max-width: 240px; aspect-ratio: 1; margin: 0 auto;
    overflow: hidden; background: var(--bg-alt); border: 1px solid var(--line);
    touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  }
  .frame-box:active { cursor: grabbing; }
  .frame-box img { pointer-events: none; -webkit-user-drag: none; }
  .frame-controls { display: flex; align-items: center; gap: 8px; max-width: 240px; margin: 8px auto 0; font-size: 12px; color: var(--text-faint); }
  .frame-controls input[type="range"] { flex: 1; min-width: 0; accent-color: var(--brand-accent); }
  .frame-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
  .frame-buttons .btn { padding: 5px 10px; font-size: 10.5px; }

  .tag-input-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--bg-alt); border: 1px solid var(--line); padding: 6px 8px; }
  .tag-input-row .tag-pill-edit {
    font-size: 10px; padding: 2px 6px; background: var(--brand-accent-dim); color: var(--brand-accent); display: flex; align-items: center; gap: 4px;
  }
  .tag-pill-edit button { background: transparent; border: none; color: var(--brand-accent); cursor: pointer; font-size: 11px; line-height: 1; padding: 0; }
  .tag-input-row input {
    flex: 1; min-width: 80px; background: transparent; border: none; outline: none; font-size: 11px; color: var(--text);
  }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--panel); border: 1px solid var(--brand-accent-dim); color: var(--brand-accent);
    font-size: 11px; padding: 8px 16px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- confirm dialog ---- */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(var(--scrim-rgb),.6); display: none;
    align-items: center; justify-content: center; z-index: 70; padding: 20px;
  }
  .confirm-overlay.is-open { display: flex; }
  .confirm-box {
    width: 100%; max-width: 300px; background: var(--panel); border: 1px solid var(--magenta-dim); padding: 16px 18px;
  }
  .confirm-box .cf-msg { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 14px; }
  .confirm-box .cf-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
<script src="sideops-theme-bridge.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="app-bar">
    <span class="app-title">// PROMPT GALLERY RED</span>
    <div class="bar-right">
      <div class="bar-filter">
        <div class="search-box">
          <span style="color:var(--text-faint); font-size:11px;">⌕</span>
          <input type="text" id="searchInput" placeholder="タイトル・タグで検索">
        </div>
        <div class="tag-filter-chips" id="tagChips"></div>
      </div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     IndexedDB レイヤー
     画像はBlobのまま保存（Base64化によるサイズ膨張・容量圧迫を避けるため）。
     1件 = { id, title, prompt, negative, tags: string[], image: Blob, createdAt, thumb? }
     thumb（2026-10-06〜・任意）＝一覧のサムネイルの見え方 { ar, z, cx, cy }（下の「枠合わせ」参照）
  ===================================================================== */
  const DB_NAME = 'sideops_prompt_gallery_red';
  const DB_VERSION = 2;
  const STORE = 'entries';
  const SETTINGS_STORE = 'settings';
  let db = null;

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (ev) => {
        const _db = ev.target.result;
        if (!_db.objectStoreNames.contains(STORE)) {
          const store = _db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('createdAt', 'createdAt', { unique: false });
        }
        if (!_db.objectStoreNames.contains(SETTINGS_STORE)) {
          _db.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function settingsStore(mode) {
    const tx = db.transaction(SETTINGS_STORE, mode);
    return tx.objectStore(SETTINGS_STORE);
  }

  function dbGetSetting(key) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readonly').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  }

  function dbSetSetting(key, value) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readwrite').put({ key, value });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function txStore(mode) {
    const tx = db.transaction(STORE, mode);
    return tx.objectStore(STORE);
  }

  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const req = txStore('readonly').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(entry) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').put(entry);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  /* ===================== state ===================== */
  let entries = [];          // メモリ上のキャッシュ
  let activeTagFilter = null;
  let searchQuery = '';
  let editingId = null;      // モーダルが編集中のentry id（nullなら新規）
  let pendingImageFile = null; // モーダルで選択中の新しい画像ファイル（未保存）
  let editTags = [];          // モーダル編集中のタグ配列
  let frequentTags = [];      // ユーザーが登録した「よく使うタグ」の配列
  let tagColors = {};         // { タグ名: '#rrggbb' } のマップ
  let selectMode = false;             // 選択削除モードのON/OFF
  let selectedForDelete = new Set();  // 選択削除モード中に選んだentry idの集合

  /* ===================== DOM refs ===================== */
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const tagChips = document.getElementById('tagChips');
  const addBtn = document.getElementById('addBtn');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const saveBtn = document.getElementById('saveBtn');

  const imageDrop = document.getElementById('imageDrop');
  const titleInput = document.getElementById('titleInput');
  const promptInput = document.getElementById('promptInput');
  const negativeInput = document.getElementById('negativeInput');
  const tagInputRow = document.getElementById('tagInputRow');
  const tagInput = document.getElementById('tagInput');
  const freqTagPicker = document.getElementById('freqTagPicker');

  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const menuPanel = document.getElementById('menuPanel');
  const selectModeMenuPanel = document.getElementById('selectModeMenuPanel');
  const menuItemFreqTags = document.getElementById('menuItemFreqTags');
  const menuItemTagColors = document.getElementById('menuItemTagColors');
  const menuItemSelectMode = document.getElementById('menuItemSelectMode');
  const menuItemExitSelect = document.getElementById('menuItemExitSelect');
  const menuItemDeleteSelected = document.getElementById('menuItemDeleteSelected');
  const selectModeHint = document.getElementById('selectModeHint');

  const freqTagModalOverlay = document.getElementById('freqTagModalOverlay');
  const freqTagModalCloseBtn = document.getElementById('freqTagModalCloseBtn');
  const freqTagAddInput = document.getElementById('freqTagAddInput');
  const freqTagAddBtn = document.getElementById('freqTagAddBtn');
  const freqTagList = document.getElementById('freqTagList');

  const tagColorModalOverlay = document.getElementById('tagColorModalOverlay');
  const tagColorModalCloseBtn = document.getElementById('tagColorModalCloseBtn');
  const tagMoreModalOverlay = document.getElementById('tagMoreModalOverlay');
  const tagMoreModalCloseBtn = document.getElementById('tagMoreModalCloseBtn');
  const tagMoreList = document.getElementById('tagMoreList');
  const tagColorList = document.getElementById('tagColorList');

  const discardOverlay = document.getElementById('discardOverlay');
  const discardKeepBtn = document.getElementById('discardKeepBtn');
  const discardOkBtn = document.getElementById('discardOkBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

  const thumbLightbox = document.getElementById('thumbLightbox');
  const thumbLightboxImg = document.getElementById('thumbLightboxImg');
  const thumbLightboxCloseBtn = document.getElementById('thumbLightboxCloseBtn');
  const lbHint = document.getElementById('lbHint');
  const lbMenu = document.getElementById('lbMenu');
  const lbMenuTitle = document.getElementById('lbMenuTitle');
  const lbCopyPrompt = document.getElementById('lbCopyPrompt');
  const lbCopyNegative = document.getElementById('lbCopyNegative');
  const lbEdit = document.getElementById('lbEdit');
  const lbDelete = document.getElementById('lbDelete');

  const frameEditor = document.getElementById('frameEditor');
  const frameBox = document.getElementById('frameBox');
  const frameImg = document.getElementById('frameImg');
  const frameZoom = document.getElementById('frameZoom');
  const frameFitBtn = document.getElementById('frameFitBtn');
  const frameFillBtn = document.getElementById('frameFillBtn');
  const frameChangeBtn = document.getElementById('frameChangeBtn');

  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ===================== タグ色ユーティリティ =====================
     背景色の相対輝度（WCAG簡易版）から、読みやすい文字色（黒 or 白）を自動判定する。
     色未設定のタグは、既存デザインのcyanトーンをそのまま使う（見た目の後方互換）。 */
  function hexToRgb(hex) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return null;
    const num = parseInt(m[1], 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function relativeLuminance({ r, g, b }) {
    const [R, G, B] = [r, g, b].map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }
  function tagColorCss(tagName) {
    const color = tagColors[tagName];
    if (!color) return null;
    const rgb = hexToRgb(color);
    if (!rgb) return null;
    const textColor = relativeLuminance(rgb) > 0.5 ? '#0a0a0a' : '#f5f9fa';
    return `background:${color}; border-color:${color}; color:${textColor};`;
  }
  function tagPillStyle(tagName) {
    const css = tagColorCss(tagName);
    return css ? ` style="${css}"` : '';
  }

  /* ===================== 画像URL管理 =====================
     Blob→ObjectURLは作成しっぱなしにするとメモリリークするため、
     再描画のたびに古いURLをrevokeしてから新しく生成する。 */
  let activeObjectUrls = new Set();
  function revokeAllObjectUrls() {
    activeObjectUrls.forEach(u => URL.revokeObjectURL(u));
    activeObjectUrls.clear();
  }
  function makeObjectUrl(blob) {
    const url = URL.createObjectURL(blob);
    activeObjectUrls.add(url);
    return url;
  }

  /* ===================== サムネイルの見え方（枠合わせ）（2026-10-06） =====================
     一覧のカードは正方形。以前は常に「中央を正方形に切り抜く」（object-fit: cover）だったため、
     縦長・横長の画像は上下や左右が見切れていた。登録・編集のときに拡大縮小と位置を決められるように
     し、その結果を entry.thumb に保存する。
       thumb = { ar, z, cx, cy }
         ar … 画像の縦横比（幅÷高さ）。カードを描くたびに画像の大きさを調べずに配置を計算するため
         z  … 拡大率。1 =「枠いっぱい」（短い辺が枠にぴったり＝以前の見え方）。
               最小は「全体を表示」（長い辺が枠にぴったり。余白は背景色）、最大は THUMB_Z_MAX
         cx, cy … 枠の中心に来る、画像の上の位置（0〜1）
     thumb がない登録（以前に登録したもの・読めない値）は、以前どおり中央で切り抜く。
     計算はすべて「枠の一辺 = 100」の％で行うので、カードの大きさが変わっても見え方は同じ */
  const THUMB_Z_MAX = 4;
  function clampNum(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function thumbZMin(ar) { return Math.min(ar, 1 / ar); }
  function thumbLayout(t) {
    const W = 100 * Math.max(t.ar, 1) * t.z;
    const H = 100 * Math.max(1 / t.ar, 1) * t.z;
    // 枠より大きい向きは、端が枠の内側に入り込まない範囲で動かす。枠より小さい向きは真ん中に置く
    const left = W >= 100 ? clampNum(50 - t.cx * W, 100 - W, 0) : (100 - W) / 2;
    const top = H >= 100 ? clampNum(50 - t.cy * H, 100 - H, 0) : (100 - H) / 2;
    return { W, H, left, top };
  }
  // 拡大率を範囲内に収め、位置を「実際に見えている位置」に直す（動かしすぎても余白が出ない）
  function settleThumb(t) {
    const z = clampNum(t.z, thumbZMin(t.ar), THUMB_Z_MAX);
    const L = thumbLayout({ ar: t.ar, z, cx: t.cx, cy: t.cy });
    return { ar: t.ar, z, cx: (50 - L.left) / L.W, cy: (50 - L.top) / L.H };
  }
  // 保存されている値を確かめる（壊れた値・ほかの版の値は使わない）
  function normalizeThumb(t) {
    if (!t || typeof t !== 'object') return null;
    const ar = Number(t.ar), z = Number(t.z), cx = Number(t.cx), cy = Number(t.cy);
    if (![ar, z, cx, cy].every(Number.isFinite) || ar < 0.01 || ar > 100) return null;
    return settleThumb({ ar, z, cx: clampNum(cx, 0, 1), cy: clampNum(cy, 0, 1) });
  }
  function roundThumb(t) {
    const r = (v) => Math.round(v * 10000) / 10000;
    return { ar: r(t.ar), z: r(t.z), cx: r(t.cx), cy: r(t.cy) };
  }
  function applyThumb(img, t) {
    const L = thumbLayout(t);
    img.classList.add('framed');
    img.style.width = L.W + '%';
    img.style.height = L.H + '%';
    img.style.left = L.left + '%';
    img.style.top = L.top + '%';
  }

  // クリップボードへコピー（カードのメニューと、拡大表示のメニューで共用）
  async function copyWithFeedback(btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      if (!btn.dataset.label) btn.dataset.label = btn.textContent;
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      clearTimeout(btn._copiedTimer);
      btn._copiedTimer = setTimeout(() => { btn.textContent = btn.dataset.label; btn.classList.remove('copied'); }, 1200);
    } catch (err) {
      showToast('コピーに失敗しました（ブラウザ設定をご確認ください）');
    }
  }

  /* ===================== データ読み込み・描画 ===================== */
  async function loadAndRender() {
    entries = await dbGetAll();
    entries.sort((a, b) => b.createdAt - a.createdAt);
    renderTagChips();
    renderGrid();
  }

  function getAllTags() {
    const set = new Set();
    entries.forEach(e => (e.tags || []).forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  /* 出現回数の多い順にタグを並べる。同数の場合はアルファベット順にして、
     表示順が理由もなく揺れ動かないようにする（安定ソート） */
  function getAllTagsByFrequency() {
    const count = new Map();
    entries.forEach(e => (e.tags || []).forEach(t => count.set(t, (count.get(t) || 0) + 1)));
    return Array.from(count.keys()).sort((a, b) => {
      const diff = count.get(b) - count.get(a);
      return diff !== 0 ? diff : a.localeCompare(b);
    });
  }

  function makeTagChip(tag) {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeTagFilter === tag ? ' active' : '');
    chip.textContent = tag;
    chip.disabled = selectMode;
    if (activeTagFilter === tag) {
      const color = tagColors[tag];
      if (color) {
        chip.style.borderColor = color;
        chip.style.color = color;
        chip.style.background = 'transparent';
      }
    }
    chip.addEventListener('click', () => {
      activeTagFilter = (activeTagFilter === tag) ? null : tag;
      closeTagMoreModal();
      renderTagChips();
      renderGrid();
    });
    return chip;
  }

  /* ヘッダーの高さを一定に保つため、チップは折り返さず(nowrap)、
     .tag-filter-chips の実際の幅に収まる分だけ描画する。
     収まりきらない分（絞り込み中の1個を除く）は「+n」ボタン1個にまとめ、
     クリックでモーダルを開いて全部から選べるようにする（2026-09-25）。
     誤作動防止：絞り込み中のタグが「+n」側に押し出されて見えなくなると、
     何で絞り込んでいるか画面から分からなくなるため、選択中のタグは
     常に手前（左）に出し、打ち切りの対象から除外する */
  function renderTagChips() {
    const allTags = getAllTagsByFrequency();
    tagChips.innerHTML = '';
    if (!allTags.length) return;

    const ordered = activeTagFilter && allTags.includes(activeTagFilter)
      ? [activeTagFilter, ...allTags.filter(t => t !== activeTagFilter)]
      : allTags;

    // 実際に測るため、まず全部を一時的に流し込んでみる
    ordered.forEach(tag => tagChips.appendChild(makeTagChip(tag)));

    const wrapWidth = tagChips.clientWidth;
    const children = Array.from(tagChips.children);
    let usedWidth = 0;
    let cutAt = children.length;
    // 「+n」ボタン自体の幅の見積もり（実測前なので概算。狭くはみ出す分は許容する）
    const MORE_BTN_WIDTH_ESTIMATE = 34;
    for (let i = 0; i < children.length; i++) {
      const w = children[i].offsetWidth + 5; // gap分
      const remaining = ordered.length - (i + 1);
      const needsMoreBtn = remaining > 0;
      const budget = wrapWidth - (needsMoreBtn ? MORE_BTN_WIDTH_ESTIMATE : 0);
      if (usedWidth + w > budget) { cutAt = i; break; }
      usedWidth += w;
    }
    // 1個も入らない極端な幅でも、選択中のタグ（か先頭の1個）だけは出す
    cutAt = Math.max(cutAt, activeTagFilter ? 1 : 0);

    const hiddenCount = ordered.length - cutAt;
    if (hiddenCount > 0) {
      children.slice(cutAt).forEach(el => el.remove());
      const moreBtn = document.createElement('button');
      moreBtn.className = 'chip chip-more';
      moreBtn.textContent = `+${hiddenCount}`;
      moreBtn.title = 'その他のタグで絞り込み';
      moreBtn.addEventListener('click', () => openTagMoreModal());
      tagChips.appendChild(moreBtn);
    }
  }

  // 画面の幅が変わったら（回転・Stageの大きさの変化など）、入るタグの数も変わるので並べ直す（2026-10-06）
  let tagChipsResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(tagChipsResizeTimer);
    tagChipsResizeTimer = setTimeout(renderTagChips, 150);
  });

  function openTagMoreModal() {
    tagMoreList.innerHTML = '';
    getAllTagsByFrequency().forEach(tag => tagMoreList.appendChild(makeTagChip(tag)));
    tagMoreModalOverlay.classList.add('is-open');
  }
  function closeTagMoreModal() {
    tagMoreModalOverlay.classList.remove('is-open');
  }
  tagMoreModalCloseBtn.addEventListener('click', closeTagMoreModal);
  tagMoreModalOverlay.addEventListener('click', (e) => { if (e.target === tagMoreModalOverlay) closeTagMoreModal(); });

  function matchesFilter(entry) {
    if (activeTagFilter && !(entry.tags || []).includes(activeTagFilter)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const inTitle = (entry.title || '').toLowerCase().includes(q);
      const inTags = (entry.tags || []).some(t => t.toLowerCase().includes(q));
      if (!inTitle && !inTags) return false;
    }
    return true;
  }

  function renderGrid() {
    revokeAllObjectUrls();
    const list = entries.filter(matchesFilter);
    const bodyEl = grid.parentElement;
    const existingEmpty = bodyEl.querySelector('.empty-state');
    if (existingEmpty) existingEmpty.remove();

    if (entries.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">まだ登録がありません</div>
        <div class="small">右上の「＋ 新規登録」から、画像とプロンプトを登録してみましょう。</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    if (list.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">該当する登録がありません</div>
        <div class="small">検索条件やタグ絞り込みを変えてみてください。</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    grid.innerHTML = '';
    list.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = entry.id;

      const imgUrl = entry.image ? makeObjectUrl(entry.image) : '';
      const tagsHtml = (entry.tags || []).map(t => `<span class="tag-pill"${tagPillStyle(t)}>${escapeHtml(t)}</span>`).join('');
      const isMarked = selectedForDelete.has(entry.id);

      card.innerHTML = `
        ${imgUrl ? `<img src="${imgUrl}" alt="${escapeHtml(entry.title || '')}">` : ''}
        <div class="card-title">${escapeHtml(entry.title || '(無題)')}</div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="card-erase-overlay${isMarked ? ' is-marked' : ''}"><span class="erase-label">消去</span></div>
      `;
      const thumb = normalizeThumb(entry.thumb);
      const cardImg = card.querySelector('img');
      if (cardImg && thumb) applyThumb(cardImg, thumb);

      if (selectMode) {
        card.classList.add('select-target');
        card.addEventListener('click', () => toggleSelectForDelete(entry.id));
      } else {
        // カードをクリック（タップ）→ 拡大表示。メニューは拡大した画像をクリックして出す。
        // PC・スマホ共通（2026-10-07。それまでPCはマウスを乗せるとカードの上にメニューが出ていた）
        card.addEventListener('click', () => openThumbLightbox(entry, imgUrl));
      }

      grid.appendChild(card);
    });
  }

  /* ===================== 検索・フィルタ ===================== */
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    renderGrid();
  });

  /* ===================== モーダル：登録／編集 ===================== */
  function pickImageFile() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
    inp.addEventListener('change', handleImageSelect);
    document.body.appendChild(inp);
    inp.click();
    // 選択ダイアログを閉じた後、要らなくなった一時input要素を掃除する
    inp.addEventListener('change', () => setTimeout(() => inp.remove(), 0), { once: true });
  }
  function bindImageDropClick() {
    imageDrop.onclick = pickImageFile;
  }

  function resetModalFields() {
    pendingImageFile = null;
    editTags = [];
    titleInput.value = '';
    promptInput.value = '';
    negativeInput.value = '';
    tagInput.value = '';
    imageDrop.classList.remove('has-image');
    imageDrop.innerHTML = '<span>クリックして画像を選択</span>';
    bindImageDropClick();
    hideFrameEditor();
    renderTagInputRow();
    renderFreqTagPicker();
  }

  function handleImageSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('画像ファイルを選択してください');
      return;
    }
    pendingImageFile = file;
    showFrameEditor(file, null); // 新しい画像は「枠いっぱい・中央」から始める
  }

  /* ---- 枠合わせ（登録・編集モーダル）（2026-10-06） ----
     画像があるときは、画像を選ぶ枠の代わりに、一覧のカードと同じ正方形の枠を出す。
     ドラッグ（1本指）で位置、ピンチ（2本指）・ホイール・スライダーで拡大縮小。
     画像の縦横比が分かる（読み込みが終わる）までは frameState = null で、操作も保存もしない */
  let frameState = null;      // { ar, z, cx, cy }
  let frameBaseline = null;   // 画像を読み込んだ時点の frameState（入力を捨てる確認で、見え方を変えたかを調べる）
  let frameObjectUrl = null;  // 枠に表示中の画像のURL（閉じるときに解放する）
  let frameLoadSeq = 0;       // 画像を続けて差し替えたとき、古い読み込みの結果を使わないため
  const framePointers = new Map();
  let framePinch = null;

  function hideFrameEditor() {
    frameLoadSeq++;
    frameState = null;
    frameBaseline = null;
    framePointers.clear();
    framePinch = null;
    frameEditor.classList.remove('is-open');
    imageDrop.style.display = '';
    frameImg.removeAttribute('src');
    frameImg.removeAttribute('style');
    if (frameObjectUrl) { URL.revokeObjectURL(frameObjectUrl); frameObjectUrl = null; }
  }

  function showFrameEditor(blob, initialThumb) {
    hideFrameEditor();
    const seq = frameLoadSeq;
    frameObjectUrl = URL.createObjectURL(blob);
    imageDrop.style.display = 'none';
    frameEditor.classList.add('is-open');
    frameImg.onload = () => {
      if (seq !== frameLoadSeq) return;
      const ar = frameImg.naturalWidth / frameImg.naturalHeight;
      if (!(ar > 0) || !Number.isFinite(ar)) return;
      // 保存済みの見え方は、同じ画像（縦横比がほぼ同じ）のときだけ引き継ぐ
      const keep = initialThumb && Math.abs(initialThumb.ar - ar) / ar < 0.02;
      frameState = settleThumb(keep ? { ...initialThumb, ar } : { ar, z: 1, cx: 0.5, cy: 0.5 });
      frameBaseline = { ...frameState }; // 開いた時点の見え方（変えたかどうかの判定用）
      frameZoom.min = String(thumbZMin(ar));
      frameZoom.max = String(THUMB_Z_MAX);
      renderFrame();
    };
    frameImg.onerror = () => { if (seq === frameLoadSeq) showToast('画像を読み込めませんでした'); };
    frameImg.src = frameObjectUrl;
  }

  function renderFrame() {
    if (!frameState) return;
    applyThumb(frameImg, frameState);
    frameZoom.value = String(frameState.z);
  }
  function setFrame(next) {
    if (!frameState) return;
    frameState = settleThumb(next);
    renderFrame();
  }

  frameBox.addEventListener('pointerdown', (e) => {
    if (!frameState) return;
    e.preventDefault();
    try { frameBox.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動かせる */ }
    framePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (framePointers.size === 2) {
      const [a, b] = [...framePointers.values()];
      framePinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: frameState.z };
    }
  });
  frameBox.addEventListener('pointermove', (e) => {
    const p = framePointers.get(e.pointerId);
    if (!p || !frameState) return;
    const size = frameBox.clientWidth || 1;
    if (framePointers.size === 1) {
      const L = thumbLayout(frameState);
      const dx = (e.clientX - p.x) / size * 100;
      const dy = (e.clientY - p.y) / size * 100;
      setFrame({ ...frameState, cx: frameState.cx - dx / L.W, cy: frameState.cy - dy / L.H });
    }
    p.x = e.clientX; p.y = e.clientY;
    if (framePointers.size === 2 && framePinch) {
      const [a, b] = [...framePointers.values()];
      setFrame({ ...frameState, z: framePinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / framePinch.d) });
    }
  });
  function endFramePointer(e) {
    framePointers.delete(e.pointerId);
    if (framePointers.size < 2) framePinch = null;
  }
  frameBox.addEventListener('pointerup', endFramePointer);
  frameBox.addEventListener('pointercancel', endFramePointer);
  frameBox.addEventListener('lostpointercapture', endFramePointer);
  frameBox.addEventListener('wheel', (e) => {
    if (!frameState) return;
    e.preventDefault();
    setFrame({ ...frameState, z: frameState.z * Math.exp(-e.deltaY * 0.0015) });
  }, { passive: false });
  frameZoom.addEventListener('input', () => setFrame({ ...frameState, z: Number(frameZoom.value) }));
  frameFitBtn.addEventListener('click', () => {
    if (frameState) setFrame({ ...frameState, z: thumbZMin(frameState.ar), cx: 0.5, cy: 0.5 });
  });
  frameFillBtn.addEventListener('click', () => {
    if (frameState) setFrame({ ...frameState, z: 1, cx: 0.5, cy: 0.5 });
  });
  frameChangeBtn.addEventListener('click', pickImageFile);

  function renderTagInputRow() {
    tagInputRow.querySelectorAll('.tag-pill-edit').forEach(el => el.remove());
    editTags.forEach((tag, idx) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill-edit';
      const css = tagColorCss(tag);
      if (css) pill.setAttribute('style', css);
      pill.innerHTML = `${escapeHtml(tag)} <button type="button" data-idx="${idx}">✕</button>`;
      pill.querySelector('button').addEventListener('click', () => {
        editTags.splice(idx, 1);
        renderTagInputRow();
      });
      tagInputRow.insertBefore(pill, tagInput);
    });
  }

  tagInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = tagInput.value.trim();
      if (val && !editTags.includes(val)) {
        editTags.push(val);
        renderTagInputRow();
      }
      tagInput.value = '';
    }
  });

  function openAddModal() {
    editingId = null;
    resetModalFields();
    modalTitle.textContent = '新規登録';
    modalOverlay.classList.add('is-open');
    modalSnapshot = formSnapshot();
    titleInput.focus();
  }

  /* サムネイル拡大ライトボックス（2026-09-25）。カード一覧描画時に
     makeObjectUrl() で発行済みのURLをそのまま使う（新たに発行しない）。
     画面に収まる範囲でなるべく大きく、原寸は超えない
     （object-fit: containではなくmax-width/max-heightで実寸を尊重、
     CSS側の .thumb-lightbox img 参照）。
     2026-10-06：カードのタップでここを開き、拡大した画像のタップでメニュー（.lb-menu）を出し入れする。
     画像のない登録は、最初からメニューを出す。画像の外（暗い所）のタップ・✕・Esc・戻るで閉じる */
  let lightboxEntry = null;
  function setLightboxMenu(open) {
    lbMenu.classList.toggle('is-open', open);
    lbHint.classList.toggle('is-hidden', open || !thumbLightboxImg.getAttribute('src'));
  }
  function openThumbLightbox(entry, imgUrl) {
    lightboxEntry = entry;
    if (imgUrl) {
      thumbLightboxImg.src = imgUrl;
      thumbLightboxImg.style.display = '';
    } else {
      thumbLightboxImg.removeAttribute('src');
      thumbLightboxImg.style.display = 'none';
    }
    thumbLightboxImg.alt = entry.title || '';
    lbMenuTitle.textContent = entry.title || '(無題)';
    lbCopyPrompt.disabled = !entry.prompt;
    lbCopyNegative.disabled = !entry.negative;
    setLightboxMenu(!imgUrl);
    thumbLightbox.classList.add('is-open');
  }
  function closeThumbLightbox() {
    thumbLightbox.classList.remove('is-open');
    lbMenu.classList.remove('is-open');
    thumbLightboxImg.removeAttribute('src');
    lightboxEntry = null;
  }
  thumbLightboxCloseBtn.addEventListener('click', closeThumbLightbox);
  thumbLightbox.addEventListener('click', (e) => { if (e.target === thumbLightbox) closeThumbLightbox(); });
  thumbLightboxImg.addEventListener('click', (e) => {
    e.stopPropagation();
    setLightboxMenu(!lbMenu.classList.contains('is-open'));
  });
  lbMenu.addEventListener('click', (e) => e.stopPropagation());
  lbCopyPrompt.addEventListener('click', () => { if (lightboxEntry) copyWithFeedback(lbCopyPrompt, lightboxEntry.prompt || ''); });
  lbCopyNegative.addEventListener('click', () => { if (lightboxEntry) copyWithFeedback(lbCopyNegative, lightboxEntry.negative || ''); });
  lbEdit.addEventListener('click', () => {
    const entry = lightboxEntry;
    closeThumbLightbox();
    if (entry) openEditModal(entry);
  });
  lbDelete.addEventListener('click', () => {
    const entry = lightboxEntry;
    closeThumbLightbox();
    if (entry) openConfirmDelete(entry.id);
  });

  function openEditModal(entry) {
    editingId = entry.id;
    resetModalFields();
    modalTitle.textContent = '編集';
    titleInput.value = entry.title || '';
    promptInput.value = entry.prompt || '';
    negativeInput.value = entry.negative || '';
    editTags = [...(entry.tags || [])];
    renderTagInputRow();
    renderFreqTagPicker();
    if (entry.image) showFrameEditor(entry.image, normalizeThumb(entry.thumb));
    modalOverlay.classList.add('is-open');
    modalSnapshot = formSnapshot();
  }

  /* ---- 入力を捨てて閉じるかの確認（2026-10-07） ----
     保存せずに閉じようとしたとき（✕・キャンセル・背景のクリック・Esc・スマホの戻るボタン）、
     開いた時点から何か変えていたら「入力した内容を捨てて閉じますか？」と聞く。
     変えたかどうか：題名・プロンプト・ネガティブ・タグ（入力途中の文字も含む）・新しい画像・見え方（枠合わせ） */
  let modalSnapshot = null;
  function formSnapshot() {
    return JSON.stringify([titleInput.value, promptInput.value, negativeInput.value, editTags]);
  }
  function frameChanged() {
    if (!frameState || !frameBaseline) return false;
    return ['z', 'cx', 'cy'].some((k) => Math.abs(frameState[k] - frameBaseline[k]) > 0.0005);
  }
  function isModalDirty() {
    if (!modalSnapshot) return false;
    return formSnapshot() !== modalSnapshot || !!pendingImageFile || tagInput.value.trim() !== '' || frameChanged();
  }
  function requestCloseModal() {
    if (!modalOverlay.classList.contains('is-open')) return;
    if (isModalDirty()) discardOverlay.classList.add('is-open');
    else closeModal();
  }
  discardKeepBtn.addEventListener('click', () => discardOverlay.classList.remove('is-open'));
  discardOkBtn.addEventListener('click', closeModal);
  discardOverlay.addEventListener('click', (e) => { if (e.target === discardOverlay) discardOverlay.classList.remove('is-open'); });

  function closeModal() {
    modalOverlay.classList.remove('is-open');
    discardOverlay.classList.remove('is-open');
    modalSnapshot = null;
    editingId = null;
    pendingImageFile = null;
    hideFrameEditor();
  }

  addBtn.addEventListener('click', openAddModal);
  modalCloseBtn.addEventListener('click', requestCloseModal);
  cancelBtn.addEventListener('click', requestCloseModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) requestCloseModal(); });

  saveBtn.addEventListener('click', async () => {
    const title = titleInput.value.trim();
    const prompt = promptInput.value.trim();
    const negative = negativeInput.value.trim();

    // フールプルーフ：タイトル・画像いずれも未指定の状態での保存を防ぐ
    // （新規登録時は画像必須、編集時は既存画像があれば省略可）
    const existing = editingId ? entries.find(e => e.id === editingId) : null;
    let imageBlob = null;
    if (pendingImageFile) {
      imageBlob = pendingImageFile;
    } else if (existing) {
      imageBlob = existing.image || null;
    }

    if (!imageBlob) {
      showToast('画像を選択してください');
      return;
    }
    if (!title) {
      showToast('タイトルを入力してください');
      return;
    }

    // 既存の登録は、この画面で扱わない項目（新しい版で増えた項目など）も消さずに引き継ぐ
    const entry = {
      ...(existing || {}),
      id: editingId || ('e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
      title,
      prompt,
      negative,
      tags: [...editTags],
      image: imageBlob,
      createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(),
    };
    // サムネイルの見え方。画像の大きさが読めなかったときは、新しい画像なら見え方なし（中央で切り抜き）、
    // 画像そのままの編集なら前の見え方を残す
    if (frameState) entry.thumb = roundThumb(frameState);
    else if (pendingImageFile) delete entry.thumb;

    try {
      await dbPut(entry);
      showToast(editingId ? '更新しました' : '登録しました');
      closeModal();
      await loadAndRender();
    } catch (err) {
      console.error(err);
      showToast('保存に失敗しました');
    }
  });

  /* ===================== 削除確認（単数／複数の両方で使う） ===================== */
  let pendingDeleteIds = null; // 配列で保持。単一削除も複数削除も同じ経路を通す

  function openConfirmDelete(id) {
    pendingDeleteIds = [id];
    confirmMsg.textContent = 'この登録を削除します。画像・プロンプトは復元できません。よろしいですか？';
    confirmOverlay.classList.add('is-open');
  }
  function openConfirmDeleteMultiple(ids) {
    pendingDeleteIds = ids;
    confirmMsg.textContent = `選択した${ids.length}件を削除します。画像・プロンプトは復元できません。よろしいですか？`;
    confirmOverlay.classList.add('is-open');
  }
  function closeConfirmDelete() {
    pendingDeleteIds = null;
    confirmOverlay.classList.remove('is-open');
  }
  confirmCancelBtn.addEventListener('click', closeConfirmDelete);
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) closeConfirmDelete(); });
  confirmDeleteBtn.addEventListener('click', async () => {
    if (!pendingDeleteIds || pendingDeleteIds.length === 0) return;
    try {
      for (const id of pendingDeleteIds) {
        await dbDelete(id);
      }
      showToast(pendingDeleteIds.length > 1 ? `${pendingDeleteIds.length}件削除しました` : '削除しました');
    } catch (err) {
      console.error(err);
      showToast('削除に失敗しました');
    } finally {
      const wasMultiple = pendingDeleteIds.length > 1;
      closeConfirmDelete();
      if (wasMultiple) exitSelectMode(); // 選択削除モードも終了して通常表示に戻す
      await loadAndRender();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (thumbLightbox.classList.contains('is-open')) closeThumbLightbox();
      else if (discardOverlay.classList.contains('is-open')) discardOverlay.classList.remove('is-open'); // 編集を続ける
      else if (confirmOverlay.classList.contains('is-open')) closeConfirmDelete();
      else if (modalOverlay.classList.contains('is-open')) requestCloseModal();
      else if (freqTagModalOverlay.classList.contains('is-open')) closeFreqTagModal();
      else if (tagColorModalOverlay.classList.contains('is-open')) closeTagColorModal();
      else if (tagMoreModalOverlay.classList.contains('is-open')) closeTagMoreModal();
      else if (menuPanel.classList.contains('is-open') || selectModeMenuPanel.classList.contains('is-open')) closeMenu();
    }
  });

  /* ===================== ハンバーガーメニュー：一覧の開閉 ===================== */
  // 通常時はmenuPanel（よく使うタグ／タグの色／選択して削除）、
  // 選択削除モード中はselectModeMenuPanel（モード解除／削除）に差し替える。
  function activeMenuPanel() {
    return selectMode ? selectModeMenuPanel : menuPanel;
  }
  function openMenu() {
    activeMenuPanel().classList.add('is-open');
    hamburgerBtn.classList.add('is-active');
  }
  function closeMenu() {
    menuPanel.classList.remove('is-open');
    selectModeMenuPanel.classList.remove('is-open');
    hamburgerBtn.classList.remove('is-active');
  }
  hamburgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeMenuPanel().classList.contains('is-open')) closeMenu(); else openMenu();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-wrap') && (menuPanel.classList.contains('is-open') || selectModeMenuPanel.classList.contains('is-open'))) {
      closeMenu();
    }
  });

  /* ===================== メニュー項目：よく使うタグモーダル ===================== */
  function openFreqTagModal() {
    closeMenu();
    renderFreqTagList();
    freqTagModalOverlay.classList.add('is-open');
  }
  function closeFreqTagModal() { freqTagModalOverlay.classList.remove('is-open'); }
  menuItemFreqTags.addEventListener('click', openFreqTagModal);
  freqTagModalCloseBtn.addEventListener('click', closeFreqTagModal);
  freqTagModalOverlay.addEventListener('click', (e) => { if (e.target === freqTagModalOverlay) closeFreqTagModal(); });

  function renderFreqTagList() {
    freqTagList.innerHTML = '';
    if (frequentTags.length === 0) {
      freqTagList.innerHTML = '<div class="menu-empty-hint">まだ登録されていません。上の欄にタグ名を入力して追加してください。</div>';
    } else {
      frequentTags.forEach((tag, idx) => {
        const row = document.createElement('div');
        row.className = 'freq-tag-row';
        row.innerHTML = `<span class="ftr-name">${escapeHtml(tag)}</span>`;
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '✕';
        delBtn.title = '「よく使うタグ」から削除（既存の登録データ自体は消えません）';
        delBtn.addEventListener('click', async () => {
          frequentTags.splice(idx, 1);
          await dbSetSetting('frequentTags', frequentTags);
          renderFreqTagList();
          renderFreqTagPicker();
        });
        row.appendChild(delBtn);
        freqTagList.appendChild(row);
      });
    }
  }

  async function addFrequentTag() {
    const val = freqTagAddInput.value.trim();
    if (!val) return;
    if (frequentTags.includes(val)) {
      showToast('すでに登録されています');
      freqTagAddInput.value = '';
      return;
    }
    frequentTags.push(val);
    await dbSetSetting('frequentTags', frequentTags);
    freqTagAddInput.value = '';
    renderFreqTagList();
    renderFreqTagPicker();
  }
  freqTagAddBtn.addEventListener('click', addFrequentTag);
  freqTagAddInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addFrequentTag(); }
  });

  // 登録・編集モーダル内、タグ入力欄の下に「よく使うタグ」をワンクリックで追加できる形で表示する。
  // 絞り込みチップと同じ配色ルール：選択中(active)のときだけ設定色を反映し、
  // 未選択のときは通常のチップと同じ見た目（白字・白枠）にする。
  function renderFreqTagPicker() {
    freqTagPicker.innerHTML = '';
    frequentTags.forEach(tag => {
      const isActive = editTags.includes(tag);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (isActive ? ' active' : '');
      chip.textContent = tag;
      const color = tagColors[tag];
      if (color && isActive) {
        chip.style.borderColor = color;
        chip.style.color = color;
        chip.style.background = 'transparent';
      }
      chip.addEventListener('click', () => {
        if (editTags.includes(tag)) {
          editTags = editTags.filter(t => t !== tag);
        } else {
          editTags.push(tag);
        }
        renderTagInputRow();
        renderFreqTagPicker();
      });
      freqTagPicker.appendChild(chip);
    });
  }

  /* ===================== メニュー項目：タグの色モーダル ===================== */
  function openTagColorModal() {
    closeMenu();
    renderTagColorList();
    tagColorModalOverlay.classList.add('is-open');
  }
  function closeTagColorModal() { tagColorModalOverlay.classList.remove('is-open'); }
  menuItemTagColors.addEventListener('click', openTagColorModal);
  tagColorModalCloseBtn.addEventListener('click', closeTagColorModal);
  tagColorModalOverlay.addEventListener('click', (e) => { if (e.target === tagColorModalOverlay) closeTagColorModal(); });

  // 色設定の対象は「現在使われている全タグ」＋「よく使うタグ登録分」の和集合。
  // 一度も使われていない色設定だけが残り続けることを避けるため、
  // 実際に使われなくなったタグの色は一覧描画時に自然に表示されなくなる
  // （tagColorsのデータ自体は消さず、同名タグが復活すれば色も復元される）。
  function getColorablesTags() {
    const set = new Set([...getAllTags(), ...frequentTags]);
    return Array.from(set).sort();
  }

  function renderTagColorList() {
    const tags = getColorablesTags();
    tagColorList.innerHTML = '';
    if (tags.length === 0) {
      tagColorList.innerHTML = '<div class="menu-empty-hint">タグを登録すると、ここで色を設定できるようになります。</div>';
      return;
    }
    tags.forEach(tag => {
      const row = document.createElement('div');
      row.className = 'tag-color-row';
      const current = tagColors[tag] || '#00f0d0';
      row.innerHTML = `
        <span class="tcr-name">${escapeHtml(tag)}</span>
        <span class="tcr-controls">
          <input type="color" value="${current}" data-tag="${escapeHtml(tag)}">
          <button type="button" class="tcr-reset" data-tag="${escapeHtml(tag)}">既定に戻す</button>
        </span>
      `;
      const colorInput = row.querySelector('input[type="color"]');
      colorInput.addEventListener('input', async () => {
        tagColors[tag] = colorInput.value;
        await dbSetSetting('tagColors', tagColors);
        renderGrid();
        renderTagChips();
      });
      row.querySelector('.tcr-reset').addEventListener('click', async () => {
        delete tagColors[tag];
        await dbSetSetting('tagColors', tagColors);
        renderTagColorList();
        renderGrid();
        renderTagChips();
      });
      tagColorList.appendChild(row);
    });
  }

  /* ===================== メニュー項目：選択削除モード ===================== */
  function setSelectModeUiLock(locked) {
    searchInput.disabled = locked;
    addBtn.disabled = locked;
    addBtn.style.opacity = locked ? '.4' : '';
    addBtn.style.pointerEvents = locked ? 'none' : '';
    tagChips.style.opacity = locked ? '.4' : '';
    tagChips.style.pointerEvents = locked ? 'none' : '';
  }

  function enterSelectMode() {
    selectMode = true;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.add('is-active');
    setSelectModeUiLock(true);
    renderGrid();
  }
  function exitSelectMode() {
    selectMode = false;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.remove('is-active');
    setSelectModeUiLock(false);
    renderGrid();
  }
  function toggleSelectForDelete(id) {
    if (selectedForDelete.has(id)) selectedForDelete.delete(id);
    else selectedForDelete.add(id);
    renderGrid();
  }
  menuItemSelectMode.addEventListener('click', enterSelectMode);
  menuItemExitSelect.addEventListener('click', exitSelectMode);
  menuItemDeleteSelected.addEventListener('click', () => {
    closeMenu();
    if (selectedForDelete.size === 0) {
      showToast('削除する項目を選択してください');
      return;
    }
    openConfirmDeleteMultiple(Array.from(selectedForDelete));
  });

  /* ===================== 初期化 ===================== */
  bindImageDropClick();
  openDb().then(async (_db) => {
    db = _db;
    const savedFreqTags = await dbGetSetting('frequentTags');
    const savedTagColors = await dbGetSetting('tagColors');
    frequentTags = Array.isArray(savedFreqTags) ? savedFreqTags : [];
    tagColors = (savedTagColors && typeof savedTagColors === 'object') ? savedTagColors : {};
    await loadAndRender();
  }).catch((err) => {
    console.error('IndexedDBの初期化に失敗しました', err);
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="big">保存機能を利用できません</div>
      <div class="small">このブラウザ／モードではIndexedDBが利用できないため、登録内容は保存されません。プライベートブラウジングモードなどをご確認ください。</div>
    </div>`;
  });
})();
</script>
</body>
</html>
