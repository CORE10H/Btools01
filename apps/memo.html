<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELDNOTES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --bg-alt: #070b10;
    --panel: #0e1620;
    --panel-hi: #121d29;
    --line: #1e3038;
    --line-soft: #14212a;
    --cyan: #00f0d0;
    --cyan-dim: #0a4a44;
    --magenta: #ff2f6e;
    --magenta-dim: #4a0f24;
    --amber: #ffb020;
    --text: #f5f9fa;
    --text-dim: #b8c4cc;
    --text-faint: #5c6b73;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'IBM Plex Sans JP', sans-serif;
    /* --- テーマ連携用（本体から上書きされる。単体表示時はこの既定値） --- */
    --bg-rgb: 5, 7, 10;
    --panel-rgb: 14, 22, 32;
    --cyan-rgb: 0, 240, 208;
    --magenta-rgb: 255, 47, 110;
    --magenta-dim-rgb: 74, 15, 36;
    --text-rgb: 245, 249, 250;
    --scrim-rgb: 0, 0, 0;
    --shadow-rgb: 0, 0, 0;
    --on-accent: #000000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  button, input, textarea { font-family: inherit; color: inherit; }
  ::selection { background: var(--cyan); color: var(--on-accent); }

  .app-shell { height: 100%; display: flex; flex-direction: column; }

  /* ---- top bar ---- */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .app-bar .app-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); letter-spacing: .04em; white-space: nowrap; }
  .bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-alt); border: 1px solid var(--line); padding: 5px 10px;
    min-width: 0;
  }
  .search-box input {
    background: transparent; border: none; outline: none; font-size: 12px; color: var(--text);
    width: 140px;
  }
  .search-box input::placeholder { color: var(--text-faint); }
  /* ヘッダー高さの固定化（2026-09-25）：以前はflex-wrapで折り返していたため、
     登録タグが増えるほどヘッダーの高さが変わってしまっていた。
     nowrap + overflow: hidden で「入るだけ並べる」構造にし、収まらない分は
     「+n」ボタン1個にまとめてモーダルへ逃がす（renderTagChips参照）。
     これにより見えている領域の高さが常に一定になる */
  .tag-filter-chips {
    display: flex; gap: 5px; flex-wrap: nowrap; overflow: hidden; max-width: 260px;
  }
  .bar-filter { display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* 狭い画面（スマホの縦向きなど）では1段に収まらず、検索欄が「＋」ボタンに重なっていた。
     2段にする（2026-10-06）：1段目＝タイトル・追加ボタン・☰、2段目＝検索欄とタグ。
     .bar-right を display: contents にして、中身を .app-bar の並びに直接参加させる */
  @media (max-width: 640px) {
    .app-bar { flex-wrap: wrap; row-gap: 8px; column-gap: 8px; padding: 8px 12px; }
    .app-bar .app-title { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .bar-right { display: contents; }
    .bar-filter { order: 1; flex: 1 1 100%; }
    .search-box { flex: 1 1 120px; max-width: 240px; }
    .search-box input { flex: 1 1 0; width: 0; min-width: 0; }
    .tag-filter-chips { flex: 1 1 0; max-width: none; min-width: 0; }
  }
  .chip {
    font-size: 10px; padding: 3px 8px; border: 1px solid var(--line); color: var(--text-dim);
    cursor: pointer; white-space: nowrap; background: transparent; flex-shrink: 0;
  }
  .chip.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
  .chip-more { border-style: dashed; color: var(--text-faint); }
  .chip-more:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .tag-more-list { display: flex; flex-direction: column; gap: 6px; }
  .tag-more-list .chip { width: 100%; text-align: left; box-sizing: border-box; }

  /* 並び順（2026-10-10）。選んだ順は端末ごとに覚える（localStorage。同期しない） */
  .sort-select {
    font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
    background: var(--bg-alt); border: 1px solid var(--line); padding: 5px 6px; cursor: pointer;
    flex-shrink: 0; outline: none; max-width: 150px;
  }
  .sort-select:hover, .sort-select:focus { border-color: var(--cyan-dim); color: var(--cyan); }
  .sort-select option { background: var(--panel); color: var(--text); }

  .btn {
    font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary { border-color: var(--cyan-dim); color: var(--cyan); }
  .btn.primary:hover { background: var(--cyan-dim); }
  .btn.danger { border-color: var(--magenta-dim); color: var(--magenta); }
  .btn.danger:hover { background: var(--magenta-dim); }

  /* ---- hamburger menu ---- */
  .menu-wrap { position: relative; flex-shrink: 0; }
  .hamburger-btn {
    width: 30px; height: 30px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hamburger-btn:hover, .hamburger-btn.is-active { border-color: var(--cyan-dim); color: var(--cyan); }

  .menu-panel {
    position: absolute; top: calc(100% + 6px); right: 0; width: 200px;
    background: var(--panel); border: 1px solid var(--line); z-index: 40; display: none;
    padding: 6px;
  }
  .menu-panel.is-open { display: block; }
  .menu-panel-item {
    width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text-dim); font-size: 12px; padding: 9px 10px; cursor: pointer;
  }
  .menu-panel-item:hover { background: var(--bg-alt); color: var(--cyan); }
  .menu-panel-item.danger:hover { color: var(--magenta); }

  /* ---- サブモーダル（よく使うタグ／タグの色） ---- */
  /* 既存不具合の修正（2026-09-26）：「よく使うタグ」「タグの色」モーダルは
     JSが classList.add('is-open') で開こうとしていたが、それに対応する
     .modal-overlay.is-open { display: flex; } が定義されておらず、
     インラインの display:none が一度も打ち消されない＝開かない状態だった。
     editor-overlay や confirm-overlay には同じ形のCSSがあり、
     .modal-overlay だけ漏れていたと見られる */
  /* 既存不具合の修正（2026-09-26）：「よく使うタグ」「タグの色」モーダルは
     JSが classList.add('is-open') で開こうとしていたが、HTML側に
     display:none がインラインで固定されており、CSSクラスでの
     display:flex 切り替えが（詳細度で）打ち消されて一度も開かない
     状態だった。editor-overlay や confirm-overlay はインラインstyleを
     持たずCSSクラスだけで開閉しており、それに合わせてインライン側の
     display:none を外し、ここで基本形として定義し直した */
  .modal-overlay { display: none; }
  .modal-overlay.is-open { display: flex; }
  .sub-modal { width: 100%; max-width: 340px; }
  /* 二重スクロールバー対策（2026-09-26）：以前は外枠(.sub-modal、
     インラインstyle)と内側(.sub-modal-body)の両方に overflow-y: auto が
     付いていて、内容が増えるとスクロールバーが2本並んで出ていた。
     外枠は overflow: hidden にして高さの「枠」だけを持ち、実際に
     スクロールするのはこの .sub-modal-body 1箇所だけにする。
     flex-shrink: 0 の modal-head（タイトル行）だけは常に見え、
     残りの領域をこの要素が埋めてスクロールする */
  .sub-modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 4px; }
  /* スクロールバーの見た目を細く、パネルの配色に馴染ませる（2026-09-26）。
     Firefox系は scrollbar-width/scrollbar-color、Chrome/Safari系は
     ::-webkit-scrollbar 系で指定する必要があり、枯れた併記が定番 */
  .sub-modal-body,
  .tag-more-list,
  .freq-tag-list,
  .tag-color-list {
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .sub-modal-body::-webkit-scrollbar,
  .tag-more-list::-webkit-scrollbar,
  .freq-tag-list::-webkit-scrollbar,
  .tag-color-list::-webkit-scrollbar { width: 6px; }
  .sub-modal-body::-webkit-scrollbar-track,
  .tag-more-list::-webkit-scrollbar-track,
  .freq-tag-list::-webkit-scrollbar-track,
  .tag-color-list::-webkit-scrollbar-track { background: transparent; }
  .sub-modal-body::-webkit-scrollbar-thumb,
  .tag-more-list::-webkit-scrollbar-thumb,
  .freq-tag-list::-webkit-scrollbar-thumb,
  .tag-color-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .sub-modal-body::-webkit-scrollbar-thumb:hover,
  .tag-more-list::-webkit-scrollbar-thumb:hover,
  .freq-tag-list::-webkit-scrollbar-thumb:hover,
  .tag-color-list::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }
  .freq-tag-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .freq-tag-add-row input {
    flex: 1; background: var(--bg-alt); border: 1px solid var(--line); padding: 6px 8px;
    font-size: 11px; color: var(--text); outline: none;
  }
  .freq-tag-add-row input:focus { border-color: var(--cyan-dim); }
  .freq-tag-list, .tag-color-list { display: flex; flex-direction: column; gap: 6px; }
  .freq-tag-row, .tag-color-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .freq-tag-row .ftr-name, .tag-color-row .tcr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .freq-tag-row button {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 10px; width: 20px; height: 20px; cursor: pointer; flex-shrink: 0;
  }
  .freq-tag-row button:hover { border-color: var(--magenta-dim); color: var(--magenta); }
  .tag-color-row { flex-shrink: 0; }
  .tag-color-row .tcr-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tag-color-row input[type="color"] {
    width: 26px; height: 22px; border: 1px solid var(--line); background: transparent; cursor: pointer; padding: 0;
  }
  .tag-color-row .tcr-reset {
    background: transparent; border: 1px solid var(--line); color: var(--text-faint);
    font-size: 9.5px; padding: 3px 6px; cursor: pointer;
  }
  .tag-color-row .tcr-reset:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .menu-empty-hint { font-size: 10.5px; color: var(--text-faint); line-height: 1.6; }

  .freq-tag-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .freq-tag-picker .chip { font-size: 10px; padding: 3px 8px; }

  /* ---- 選択削除モード ---- */
  .select-mode-hint {
    padding: 8px 16px; background: var(--magenta-dim); border-bottom: 1px solid var(--magenta);
    font-size: 11px; color: var(--text); flex-shrink: 0; display: none;
  }
  .select-mode-hint.is-active { display: block; }
  .card.select-target { cursor: pointer; }
  .card-erase-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(var(--magenta-dim-rgb), .55); border: 2px solid var(--magenta);
  }
  .card-erase-overlay.is-marked { display: flex; }
  .card-erase-overlay .erase-label {
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .06em;
    color: var(--magenta); text-shadow: 0 0 8px rgba(var(--magenta-rgb),.6);
  }

  /* ---- grid ---- */
  .app-body { flex: 1; overflow-y: auto; padding: 18px; min-height: 0; position: relative; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;
  }
  .empty-state {
    height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--text-faint); flex-direction: column; gap: 10px; padding: 40px;
  }
  .empty-state .big { font-family: var(--font-display); font-size: 13px; color: var(--text-dim); letter-spacing: .04em; }
  .empty-state .small { font-size: 11px; max-width: 320px; line-height: 1.8; }

  /* ---- メモカード（テキストのみ。画像の代わりにタイトル・本文抜粋を表示） ---- */
  .card {
    position: relative; height: 150px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; padding: 12px 12px 10px;
  }
  .card:hover { border-color: var(--cyan-dim); }
  .card-title {
    font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .card-excerpt {
    font-size: 11px; color: var(--text-dim); line-height: 1.6; flex: 1; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    white-space: pre-wrap; word-break: break-word;
  }
  .card-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    margin-top: 8px; flex-shrink: 0;
  }
  .card-date { font-size: 9.5px; color: var(--text-faint); white-space: nowrap; }
  .card-tags {
    display: flex; gap: 4px; flex-wrap: wrap; overflow: hidden; max-height: 18px; justify-content: flex-end;
  }
  .card-tags .tag-pill {
    font-size: 9px; padding: 2px 6px; background: rgba(var(--cyan-rgb),.12); border: 1px solid var(--cyan-dim);
    color: var(--cyan); white-space: nowrap;
  }
  .card-delete-btn {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text-faint);
    font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .12s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .card:hover .card-delete-btn { opacity: 1; }
  .card-delete-btn:hover { border-color: var(--magenta-dim); color: var(--magenta); }
  .card.select-target .card-delete-btn { display: none; }

  /* ---- ピン止め（2026-11-23）。留めたメモは、どの並び順でも一番上に出る ---- */
  .card-pin-btn {
    position: absolute; top: 8px; right: 32px; width: 20px; height: 20px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text-faint);
    font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .12s ease;
    display: flex; align-items: center; justify-content: center; filter: grayscale(1);
  }
  .card:hover .card-pin-btn { opacity: 1; }
  .card-pin-btn:hover { border-color: var(--cyan-dim); }
  .card.is-pinned { border-color: var(--cyan-dim); box-shadow: inset 3px 0 0 var(--cyan); }
  .card.is-pinned .card-pin-btn { opacity: 1; filter: none; border-color: var(--cyan-dim); }
  .card.is-pinned .card-title { padding-right: 48px; }
  .card.select-target .card-pin-btn { display: none; }
  /* 指で使う端末にはホバーがないので、留めていないメモにも薄く出しておく */
  @media (hover: none) { .card-pin-btn { opacity: .55; } }
  .card-date { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* ---- フォルダ（2026-11-23）。1段だけ（フォルダの中にフォルダは作らない） ---- */
  .folder-bar {
    display: flex; align-items: center; gap: 6px; padding: 7px 16px; flex-shrink: 0;
    border-bottom: 1px solid var(--line-soft); overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .folder-bar::-webkit-scrollbar { height: 4px; }
  .folder-bar::-webkit-scrollbar-thumb { background: var(--line); }
  .folder-bar.is-locked { opacity: .4; pointer-events: none; }
  .folder-chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 4px 10px; border: 1px solid var(--line); background: transparent;
    color: var(--text-dim); cursor: pointer; white-space: nowrap; max-width: 200px;
  }
  .folder-chip .fc-name { overflow: hidden; text-overflow: ellipsis; }
  .folder-chip .fc-count { font-size: 9.5px; color: var(--text-faint); }
  .folder-chip:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .folder-chip.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
  .folder-chip.active .fc-count { color: var(--cyan); }
  .folder-chip.fc-manage { border-style: dashed; color: var(--text-faint); }
  @media (max-width: 640px) { .folder-bar { padding: 6px 12px; } }

  .folder-list { display: flex; flex-direction: column; gap: 6px; }
  .folder-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .folder-row .fr-name {
    flex: 1 1 auto; min-width: 0; background: var(--bg-alt); border: 1px solid var(--line); padding: 5px 8px;
    font-size: 11px; color: var(--text); outline: none;
  }
  .folder-row .fr-name:focus { border-color: var(--cyan-dim); }
  .folder-row .fr-count { font-size: 10px; color: var(--text-faint); white-space: nowrap; min-width: 30px; text-align: right; }
  .folder-row button {
    flex-shrink: 0; height: 24px; min-width: 24px; padding: 0 6px; background: transparent; border: 1px solid var(--line);
    color: var(--text-faint); font-size: 10px; cursor: pointer; white-space: nowrap;
  }
  .folder-row button:hover:not(:disabled) { border-color: var(--cyan-dim); color: var(--cyan); }
  .folder-row button:disabled { opacity: .3; cursor: default; }
  .folder-row .fr-del:hover, .folder-row .fr-del.is-armed { border-color: var(--magenta); color: var(--magenta); }
  .move-list { display: flex; flex-direction: column; gap: 6px; }
  .move-list .folder-chip { width: 100%; max-width: none; justify-content: space-between; }

  /* ---- エディタ画面（クリックで全面展開） ---- */
  .editor-overlay {
    position: fixed; inset: 0; background: rgba(var(--scrim-rgb),.72); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  .editor-overlay.is-open { display: flex; }
  .editor-box {
    width: 100%; max-width: 640px; height: 100%; max-height: 720px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .editor-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .editor-status {
    font-size: 10px; color: var(--text-faint); letter-spacing: .03em; white-space: nowrap;
  }
  .editor-status.is-saving { color: var(--amber); }
  .editor-status.is-saved { color: var(--cyan); }
  .editor-close { width: 24px; height: 24px; background: transparent; border: 1px solid var(--line); color: var(--text-faint); font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .editor-close:hover { border-color: var(--magenta); color: var(--magenta); }
  /* Tabで来たときに、どこにいるか分かるように（本文→Tab→✕→Enterで一覧へ。2026-10-10） */
  .editor-close:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-color: var(--cyan); color: var(--cyan); }

  .editor-title-input {
    border: none; outline: none; background: transparent; color: var(--text);
    font-size: 16px; font-weight: 600; padding: 14px 16px 8px; flex-shrink: 0;
  }
  .editor-title-input::placeholder { color: var(--text-faint); }

  .editor-tags-row {
    padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  }
  .tag-pill-edit {
    font-size: 10px; padding: 2px 6px; background: var(--cyan-dim); color: var(--cyan); display: flex; align-items: center; gap: 4px;
  }
  .tag-pill-edit button { background: transparent; border: none; color: var(--cyan); cursor: pointer; font-size: 11px; line-height: 1; padding: 0; }
  .editor-tag-input {
    min-width: 90px; background: transparent; border: none; outline: none; font-size: 11px; color: var(--text);
    border-bottom: 1px dashed var(--line);
    /* 1行の textarea（2026-11-23。スマホの「決定・改行」でも確実にタグにするため。JS側の説明を参照） */
    font-family: inherit; line-height: 1.6; height: 1.6em; padding: 0; resize: none; overflow: hidden; white-space: nowrap;
  }
  .editor-tag-add {
    display: none; font-size: 10px; padding: 1px 8px; background: transparent; cursor: pointer;

<script>
(function () {
  'use strict';

  /* =====================================================================
     IndexedDB レイヤー
     プロンプトギャラリー（apps/prompt-gallery.html）と同じ設計方針を踏襲。
     画像を扱わないため保存内容はすべてテキスト（Blobなし）。
     1件 = { id, title, body, tags: string[], createdAt, updatedAt, folderId?, pinned? }
       folderId：入れているフォルダのid（無い・消えたフォルダなら「未分類」）。2026-11-23〜
       pinned：true なら一覧の一番上に留める。2026-11-23〜
       ※フォルダとピンの変更では updatedAt を変えない（「更新」は中身を書き換えた日時のまま）
     フォルダの一覧は settings ストアの key 'folders'：[{ id, name }]（並びがそのまま表示順）
  ===================================================================== */
  const DB_NAME = 'sideops_memo';
  const DB_VERSION = 1;
  const STORE = 'entries';
  const SETTINGS_STORE = 'settings';
  let db = null;

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (ev) => {
        const _db = ev.target.result;
        if (!_db.objectStoreNames.contains(STORE)) {
          const store = _db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
        if (!_db.objectStoreNames.contains(SETTINGS_STORE)) {
          _db.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function settingsStore(mode) {
    const tx = db.transaction(SETTINGS_STORE, mode);
    return tx.objectStore(SETTINGS_STORE);
  }
  function dbGetSetting(key) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readonly').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  }
  function dbSetSetting(key, value) {
    return new Promise((resolve, reject) => {
      const req = settingsStore('readwrite').put({ key, value });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function txStore(mode) {
    const tx = db.transaction(STORE, mode);
    return tx.objectStore(STORE);
  }
  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const req = txStore('readonly').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  function dbPut(entry) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').put(entry);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const req = txStore('readwrite').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  /* ===================== state ===================== */

  let activeTagFilter = null;
  let searchQuery = '';
  let editingId = null;       // エディタで開いているメモのid（新規はDB確定前はnull）
  let editTags = [];
  let frequentTags = [];
  let tagColors = {};

  /* フォルダ（2026-11-23）。1段だけ。どのフォルダを見ているかは端末ごとの好みなので localStorage に覚える */
  const FOLDER_VIEW_KEY = 'sideops_memo_folder';
  const FOLDER_NAME_MAX = 30;
  const FOLDER_MAX = 50;
  let folders = [];             // [{ id, name }]
  let activeFolder = 'all';     // 'all'（すべて）| 'none'（未分類）| フォルダのid
  try { activeFolder = localStorage.getItem(FOLDER_VIEW_KEY) || 'all'; } catch (err) { /* 覚えられない環境では「すべて」 */ }
  let editFolderId = null;      // まだ保存していない新規メモのフォルダ
  let editPinned = false;       // まだ保存していない新規メモのピン

  /* 並び順（2026-10-10）。端末ごとの好みなので、同期されるDB（settingsストア）ではなく
     localStorage に覚える。読めない値・使えない環境では「更新が新しい順」（以前の並び）に戻す */
  const SORT_KEY = 'sideops_memo_sort';
  const SORT_ORDERS = ['updated-desc', 'updated-asc', 'created-desc', 'created-asc', 'title-asc', 'title-desc'];
  let sortOrder = 'updated-desc';
  try {
    const saved = localStorage.getItem(SORT_KEY);
    if (SORT_ORDERS.includes(saved)) sortOrder = saved;
  } catch (err) { /* 覚えられない環境では既定の順 */ }

  // 自動保存まわりの状態
  let saveTimer = null;
  const SAVE_DEBOUNCE_MS = 600;
  let savePromiseChain = Promise.resolve(); // 誤作動防止：保存処理の多重実行（競合）を防ぐための直列化キュー
  let editorIsOpen = false;

  /* ===================== DOM refs ===================== */
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const tagChips = document.getElementById('tagChips');
  const sortSelect = document.getElementById('sortSelect');
  const addBtn = document.getElementById('addBtn');

  const editorOverlay = document.getElementById('editorOverlay');

  const editorCloseBtn = document.getElementById('editorCloseBtn');
  const editorTitleInput = document.getElementById('editorTitleInput');
  const editorBodyInput = document.getElementById('editorBodyInput');

  const menuPanel = document.getElementById('menuPanel');
  const selectModeMenuPanel = document.getElementById('selectModeMenuPanel');
  const menuItemFreqTags = document.getElementById('menuItemFreqTags');
  const menuItemTagColors = document.getElementById('menuItemTagColors');
  const menuItemSelectMode = document.getElementById('menuItemSelectMode');
  const menuItemExitSelect = document.getElementById('menuItemExitSelect');
  const menuItemDeleteSelected = document.getElementById('menuItemDeleteSelected');
  const selectModeHint = document.getElementById('selectModeHint');
  const menuItemFolders = document.getElementById('menuItemFolders');
  const menuItemMoveSelected = document.getElementById('menuItemMoveSelected');
  const folderBar = document.getElementById('folderBar');
  const folderModalOverlay = document.getElementById('folderModalOverlay');
  const folderModalCloseBtn = document.getElementById('folderModalCloseBtn');
  const folderAddInput = document.getElementById('folderAddInput');
  const folderAddBtn = document.getElementById('folderAddBtn');
  const folderList = document.getElementById('folderList');
  const moveModalOverlay = document.getElementById('moveModalOverlay');
  const moveModalCloseBtn = document.getElementById('moveModalCloseBtn');
  const moveModalTitle = document.getElementById('moveModalTitle');
  const moveList = document.getElementById('moveList');
  const editorFolderSelect = document.getElementById('editorFolderSelect');
  const editorPinBtn = document.getElementById('editorPinBtn');

  const freqTagModalOverlay = document.getElementById('freqTagModalOverlay');
  const freqTagModalCloseBtn = document.getElementById('freqTagModalCloseBtn');
  const freqTagAddInput = document.getElementById('freqTagAddInput');
  const freqTagAddBtn = document.getElementById('freqTagAddBtn');
  const freqTagList = document.getElementById('freqTagList');

  const tagColorModalOverlay = document.getElementById('tagColorModalOverlay');
  const tagColorModalCloseBtn = document.getElementById('tagColorModalCloseBtn');
  const tagColorList = document.getElementById('tagColorList');
  const tagMoreModalOverlay = document.getElementById('tagMoreModalOverlay');
  const tagMoreModalCloseBtn = document.getElementById('tagMoreModalCloseBtn');
  const tagMoreList = document.getElementById('tagMoreList');

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  /* ===================== タグ色ユーティリティ（プロンプトギャラリーと同ロジック） ===================== */
  function hexToRgb(hex) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return null;
    const num = parseInt(m[1], 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function relativeLuminance({ r, g, b }) {
    const [R, G, B] = [r, g, b].map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * R + 0.7152 * G + 0.0722 * B;
  }
  function tagColorCss(tagName) {
    const color = tagColors[tagName];
    if (!color) return null;
    const rgb = hexToRgb(color);
    if (!rgb) return null;
    const textColor = relativeLuminance(rgb) > 0.5 ? '#0a0a0a' : '#f5f9fa';
    return `background:${color}; border-color:${color}; color:${textColor};`;
  }
  function tagPillStyle(tagName) {
    const css = tagColorCss(tagName);
    return css ? ` style="${css}"` : '';
  }

  /* ===================== データ読み込み・描画 ===================== */
  async function loadAndRender() {
    entries = await dbGetAll();
    entries.sort((a, b) => b.updatedAt - a.updatedAt);
    renderTagChips();
    renderFolderBar();
    renderGrid();
  }

  function getAllTags() {
    const set = new Set();
    entries.forEach(e => (e.tags || []).forEach(t => set.add(t)));
    return Array.from(set).sort();
  }

  /* 出現回数の多い順にタグを並べる。同数の場合はアルファベット順にして、
     表示順が理由もなく揺れ動かないようにする（安定ソート） */
  function getAllTagsByFrequency() {
    const count = new Map();
    entries.forEach(e => (e.tags || []).forEach(t => count.set(t, (count.get(t) || 0) + 1)));
    return Array.from(count.keys()).sort((a, b) => {
      const diff = count.get(b) - count.get(a);
      return diff !== 0 ? diff : a.localeCompare(b);
    });
  }

  function makeTagChip(tag) {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeTagFilter === tag ? ' active' : '');
    chip.textContent = tag;
    chip.disabled = selectMode;
    if (activeTagFilter === tag) {
      const color = tagColors[tag];
      if (color) {
        chip.style.borderColor = color;
        chip.style.color = color;
        chip.style.background = 'transparent';
      }
    }
    chip.addEventListener('click', () => {
      activeTagFilter = (activeTagFilter === tag) ? null : tag;
      closeTagMoreModal();
      renderTagChips();
      renderGrid();
    });
    return chip;
  }

  /* ヘッダーの高さを一定に保つため、チップは折り返さず(nowrap)、
     .tag-filter-chips の実際の幅に収まる分だけ描画する。
     収まりきらない分（絞り込み中の1個を除く）は「+n」ボタン1個にまとめ、
     クリックでモーダルを開いて全部から選べるようにする（2026-09-25）。
     誤作動防止：絞り込み中のタグが「+n」側に押し出されて見えなくなると、
     何で絞り込んでいるか画面から分からなくなるため、選択中のタグは
     常に手前（左）に出し、打ち切りの対象から除外する */
  function renderTagChips() {
    const allTags = getAllTagsByFrequency();
    tagChips.innerHTML = '';
    if (!allTags.length) return;

    const ordered = activeTagFilter && allTags.includes(activeTagFilter)
      ? [activeTagFilter, ...allTags.filter(t => t !== activeTagFilter)]
      : allTags;

    // 実際に測るため、まず全部を一時的に流し込んでみる
    ordered.forEach(tag => tagChips.appendChild(makeTagChip(tag)));

    const wrapWidth = tagChips.clientWidth;
    const children = Array.from(tagChips.children);
    let usedWidth = 0;
    let cutAt = children.length;
    // 「+n」ボタン自体の幅の見積もり（実測前なので概算。狭くはみ出す分は許容する）
    const MORE_BTN_WIDTH_ESTIMATE = 34;
    for (let i = 0; i < children.length; i++) {
      const w = children[i].offsetWidth + 5; // gap分
      const remaining = ordered.length - (i + 1);
      const needsMoreBtn = remaining > 0;
      const budget = wrapWidth - (needsMoreBtn ? MORE_BTN_WIDTH_ESTIMATE : 0);
      if (usedWidth + w > budget) { cutAt = i; break; }
      usedWidth += w;
    }
    // 1個も入らない極端な幅でも、選択中のタグ（か先頭の1個）だけは出す
    cutAt = Math.max(cutAt, activeTagFilter ? 1 : 0);

    const hiddenCount = ordered.length - cutAt;
    if (hiddenCount > 0) {
      children.slice(cutAt).forEach(el => el.remove());
      const moreBtn = document.createElement('button');
      moreBtn.className = 'chip chip-more';
      moreBtn.textContent = `+${hiddenCount}`;
      moreBtn.title = 'その他のタグで絞り込み';
      moreBtn.addEventListener('click', () => openTagMoreModal());
      tagChips.appendChild(moreBtn);
    }
  }

  // 画面の幅が変わったら（回転・Stageの大きさの変化など）、入るタグの数も変わるので並べ直す（2026-10-06）
  let tagChipsResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(tagChipsResizeTimer);
    tagChipsResizeTimer = setTimeout(renderTagChips, 150);
  });

  function openTagMoreModal() {
    tagMoreList.innerHTML = '';
    getAllTagsByFrequency().forEach(tag => tagMoreList.appendChild(makeTagChip(tag)));
    tagMoreModalOverlay.classList.add('is-open');
  }
  function closeTagMoreModal() {
    tagMoreModalOverlay.classList.remove('is-open');
  }
  tagMoreModalCloseBtn.addEventListener('click', closeTagMoreModal);
  tagMoreModalOverlay.addEventListener('click', (e) => { if (e.target === tagMoreModalOverlay) closeTagMoreModal(); });

  /* ===================== フォルダ（2026-11-23） ===================== */
  // メモが入っているフォルダ。無い・消えたフォルダ（ほかの端末で消した等）なら null（＝未分類として見せる）
  function folderOf(entry) {
    const id = entry && entry.folderId;
    return id && folders.some(f => f.id === id) ? id : null;
  }
  function folderName(id) {
    const f = folders.find(x => x.id === id);
    return f ? f.name : '未分類';
  }
  function setActiveFolder(key) {
    activeFolder = key;
    try { localStorage.setItem(FOLDER_VIEW_KEY, key); } catch (err) { /* 覚えられなくても切り替える */ }
    renderFolderBar();
    renderGrid();
  }
  function renderFolderBar() {
    // 歯止め：消えたフォルダを見ていたら「すべて」に戻す
    if (activeFolder !== 'all' && activeFolder !== 'none' && !folders.some(f => f.id === activeFolder)) activeFolder = 'all';
    const counts = new Map();
    let none = 0;
    entries.forEach(e => {
      const f = folderOf(e);
      if (f) counts.set(f, (counts.get(f) || 0) + 1); else none++;
    });
    folderBar.innerHTML = '';
    const add = (key, label, count, extraClass) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'folder-chip' + (extraClass ? ' ' + extraClass : '') + (key === activeFolder ? ' active' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(key === activeFolder));
      b.dataset.folder = key;
      b.innerHTML = `<span class="fc-name">${escapeHtml(label)}</span>` + (count == null ? '' : `<span class="fc-count">${count}</span>`);
      b.title = label;
      b.addEventListener('click', () => {
        if (key === '__manage__') { openFolderModal(); return; }
        setActiveFolder(key);
      });
      folderBar.appendChild(b);
      return b;
    };
    add('all', 'すべて', entries.length);
    folders.forEach(f => add(f.id, f.name, counts.get(f.id) || 0));
    add('none', '未分類', none);
    add('__manage__', folders.length ? '＋ ／ 編集' : '＋ フォルダを作る', null, 'fc-manage');
    const act = folderBar.querySelector('.folder-chip.active');
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function matchesFilter(entry) {
    if (activeFolder === 'none' && folderOf(entry)) return false;
    if (activeFolder !== 'all' && activeFolder !== 'none' && folderOf(entry) !== activeFolder) return false;
    if (activeTagFilter && !(entry.tags || []).includes(activeTagFilter)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const inTitle = (entry.title || '').toLowerCase().includes(q);
      const inBody = (entry.body || '').toLowerCase().includes(q);
      const inTags = (entry.tags || []).some(t => t.toLowerCase().includes(q));
      if (!inTitle && !inBody && !inTags) return false;
    }
    return true;
  }

  function displayTitle(entry) {
    if (entry.title && entry.title.trim()) return entry.title.trim();
    const firstLine = (entry.body || '').split('\n').find(l => l.trim());
    return firstLine ? firstLine.trim().slice(0, 40) : '(無題のメモ)';
  }

  // タイトル順：表示しているタイトル（未入力なら本文の冒頭）で比べる。数字は数として（メモ2 → メモ10）
  const titleCollator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
  function compareEntries(a, b) {
    const [key, dir] = sortOrder.split('-');
    const sign = dir === 'asc' ? 1 : -1;
    let diff;
    if (key === 'title') diff = titleCollator.compare(displayTitle(a), displayTitle(b));
    else if (key === 'created') diff = (a.createdAt || 0) - (b.createdAt || 0);
    else diff = (a.updatedAt || 0) - (b.updatedAt || 0);
    if (diff !== 0) return sign * diff;
    // 同じ値どうしは更新が新しい順、それでも同じならidで（並びが理由もなく入れ替わらないように）
    return ((b.updatedAt || 0) - (a.updatedAt || 0)) || String(a.id).localeCompare(String(b.id));
  }

  sortSelect.value = sortOrder;
  sortSelect.addEventListener('change', () => {
    if (!SORT_ORDERS.includes(sortSelect.value)) { sortSelect.value = sortOrder; return; }
    sortOrder = sortSelect.value;
    try { localStorage.setItem(SORT_KEY, sortOrder); } catch (err) { /* 覚えられなくても並びは変える */ }
    renderGrid();
  });

  function renderGrid() {
    // ピン止めしたメモは、どの並び順でも一番上（その中は選んだ並び順）
    const list = entries.filter(matchesFilter).sort((a, b) => (!!b.pinned - !!a.pinned) || compareEntries(a, b));
    const bodyEl = grid.parentElement;
    const existingEmpty = bodyEl.querySelector('.empty-state');
    if (existingEmpty) existingEmpty.remove();

    if (entries.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">まだメモがありません</div>
        <div class="small">右上の「＋ 新規メモ」から作成してみましょう。入力内容は自動的に保存されます。</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    if (list.length === 0) {
      grid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="big">該当するメモがありません</div>
        <div class="small">${activeFolder !== 'all' && !searchQuery && !activeTagFilter
          ? `「${escapeHtml(activeFolder === 'none' ? '未分類' : folderName(activeFolder))}」にはメモがありません。ここで「＋ 新規メモ」を押すと、このフォルダに作られます。`
          : `検索条件やタグ絞り込み${activeFolder !== 'all' ? '・フォルダ' : ''}を変えてみてください。`}</div>
      `;
      bodyEl.appendChild(empty);
      return;
    }

    grid.innerHTML = '';
    list.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'card' + (entry.pinned ? ' is-pinned' : '');
      card.dataset.id = entry.id;

      const tagsHtml = (entry.tags || []).map(t => `<span class="tag-pill"${tagPillStyle(t)}>${escapeHtml(t)}</span>`).join('');
      const isMarked = selectedForDelete.has(entry.id);
      // 「すべて」を見ているときは、どのフォルダのメモかを日時の前に出す
      const fid = folderOf(entry);
      const folderLabel = activeFolder === 'all' && fid ? `📁${escapeHtml(folderName(fid))} · ` : '';

      card.innerHTML = `
        <div class="card-title">${escapeHtml(displayTitle(entry))}</div>
        <div class="card-excerpt">${escapeHtml(entry.body || '')}</div>
        <div class="card-meta">
          <span class="card-date">${folderLabel}${formatDate(entry.updatedAt)}</span>
          <div class="card-tags">${tagsHtml}</div>
        </div>
        <button class="card-pin-btn" type="button" title="${entry.pinned ? 'ピン止めを外す' : '一番上に留める（ピン止め）'}" aria-pressed="${entry.pinned ? 'true' : 'false'}">📌</button>
        <button class="card-delete-btn" type="button" title="削除">🗑</button>
        <div class="card-erase-overlay${isMarked ? ' is-marked' : ''}"><span class="erase-label">選択</span></div>
      `;

      if (selectMode) {
        card.classList.add('select-target');
        card.addEventListener('click', () => toggleSelectForDelete(entry.id));
      } else {
        card.addEventListener('click', () => openEditor(entry));
        card.querySelector('.card-pin-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          const on = !entry.pinned;
          setMeta(entry.id, { pinned: on });
          showToast(on ? '一番上に留めました' : 'ピン止めを外しました');
          renderGrid();
        });
        card.querySelector('.card-delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openConfirmDelete(entry.id);
        });
      }

      grid.appendChild(card);
    });
  }

  /* ===================== 検索・フィルタ ===================== */
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    renderGrid();
  });

  /* =====================================================================
     エディタ（新規／編集を1つの画面で兼ねる。自動保存方式）

     誤作動防止策：
     1. デバウンス保存：入力停止後 SAVE_DEBOUNCE_MS 経過してから保存する
        （打鍵の都度DB書き込みが走ると重くなる・競合しやすくなるため）
     2. 保存処理は savePromiseChain で直列化し、多重実行を防止する
     3. 空メモ（タイトル・本文とも空）のまま閉じた場合は自動的に破棄し、
        ゴミデータをDBに残さない
     4. エディタを閉じる際は、デバウンス待機中の変更を即座に確定保存
        してから閉じる（変更の取りこぼしを防ぐ）
  ===================================================================== */
  function setEditorStatus(text, kind) {
    editorStatus.textContent = text;
    editorStatus.className = 'editor-status' + (kind ? ` is-${kind}` : '');
  }

  function currentEditorIsEmpty() {
    return !editorTitleInput.value.trim() && !editorBodyInput.value.trim() && editTags.length === 0;
  }

  // デバウンスされた保存要求。呼ぶたびにタイマーをリセットする。
  function scheduleSave() {
    setEditorStatus('編集中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { flushSave(); }, SAVE_DEBOUNCE_MS);
  }

  // 保留中の保存を即座に実行する（Promiseチェーンで直列化し、多重実行を防止）。
  function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    savePromiseChain = savePromiseChain.then(() => doSaveNow()).catch((err) => {
      console.error('自動保存に失敗しました', err);
      setEditorStatus('保存に失敗しました', null);
    });
    return savePromiseChain;
  }

  async function doSaveNow() {
    if (!editorIsOpen) return; // 誤作動防止：閉じた後に遅延実行されるのを防ぐ

    const title = editorTitleInput.value.trim();
    const body = editorBodyInput.value; // 本文は改行・空白をそのまま保持
    const now = Date.now();

    // 誤作動防止：全項目が空のメモは保存せずスキップ（無題の空カードが量産されるのを防ぐ）
    if (!title && !body.trim() && editTags.length === 0) {
      setEditorStatus('未入力（保存されません）', null);
      return;
    }

    setEditorStatus('保存中…', 'saving');

    const existing = editingId ? entries.find(e => e.id === editingId) : null;
    // 既存のメモは、ここで扱わない項目（フォルダ・ピン、これから増える項目）をそのまま引き継ぐ（2026-11-23）
    const entry = {
      ...(existing || {}),
      id: editingId || ('m_' + now + '_' + Math.random().toString(36).slice(2, 8)),
      title,
      body,
      tags: [...editTags],
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now,
    };
    if (!existing) {
      if (editFolderId) entry.folderId = editFolderId;
      if (editPinned) entry.pinned = true;
    }

    try {
      await dbPut(entry);
      editingId = entry.id; // 新規メモの初回保存以降は「編集」扱いに切り替わる
      const idx = entries.findIndex(e => e.id === entry.id);
      if (idx >= 0) entries[idx] = entry; else entries.unshift(entry);
      setEditorStatus('保存しました', 'saved');
      renderTagChips();
      renderGrid();
    } catch (err) {
      console.error(err);
      setEditorStatus('保存に失敗しました', null);
      showToast('保存に失敗しました');
    }
  }

  function renderTagInputRow() {
    editorTagsRow.querySelectorAll('.tag-pill-edit').forEach(el => el.remove());
    editTags.forEach((tag, idx) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill-edit';
      const css = tagColorCss(tag);
      if (css) pill.setAttribute('style', css);
      pill.innerHTML = `${escapeHtml(tag)} <button type="button" data-idx="${idx}">✕</button>`;
      pill.querySelector('button').addEventListener('click', () => {
        editTags.splice(idx, 1);
        renderTagInputRow();
        renderFreqTagPicker();
        scheduleSave();
      });
      editorTagsRow.insertBefore(pill, editorTagInput);
    });
  }

  /* タグの入力（2026-11-23 改修）
     スマホ（Android の日本語キーボードなど）は、キーを押したときの keydown で Enter を知らせないことがある
     （key が "Unidentified"・keyCode が 229 で届く）。そのため以前の「keydown の Enter でタグにする」だけでは、
     スマホで決定（改行）を押してもタグにならなかった。
     いまは入力欄を1行の textarea にして、「改行が入った」ことを input で見てタグにする。
     改行の入力はどのキーボードでも input で届くので、keydown の届き方に左右されない。
       ・PC：Enter（keydown）でタグにする。改行は入れない（以前と同じ）
       ・スマホ：決定・改行で入った改行を input で見つけてタグにする。改行は残さない
       ・貼り付けた文字に改行があれば、行ごとに別のタグにする
       ・入力中だけ「＋追加」ボタンを出す（キーボードに頼らない、確実な逃げ道）
     歯止め：日本語の変換中（変換を確定するEnter）では追加しない（変換前の文字がタグになってしまうため。2026-10-10） */
  function addTagsFromText(raw) {
    const parts = String(raw).split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
    let added = false;
    parts.forEach(val => {
      if (!editTags.includes(val)) { editTags.push(val); added = true; }
    });
    if (added) {
      renderTagInputRow();
      renderFreqTagPicker();
      scheduleSave();
    }
    return parts.length > 0;
  }
  function commitTagInput() {
    addTagsFromText(editorTagInput.value);
    editorTagInput.value = '';
    syncTagAddBtn();
  }
  function syncTagAddBtn() {
    editorTagAddBtn.classList.toggle('is-shown', editorTagInput.value.trim() !== '');
  }
  editorTagInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !isComposingKey(e)) {
      e.preventDefault();
      commitTagInput();
    }
  });
  function checkTagNewline(e) {
    if (e && e.isComposing) return; // 変換中は待つ（compositionend でもう一度見る）
    if (/[\r\n]/.test(editorTagInput.value)) commitTagInput();
    else syncTagAddBtn();
  }
  editorTagInput.addEventListener('input', checkTagNewline);
  editorTagInput.addEventListener('compositionend', () => setTimeout(checkTagNewline, 0));
  // 押したときに入力欄からフォーカスを外さない（スマホでキーボードが閉じないように）
  editorTagAddBtn.addEventListener('mousedown', (e) => e.preventDefault());
  editorTagAddBtn.addEventListener('click', () => {
    commitTagInput();
    editorTagInput.focus();
  });

  /* 本文をコピー（2026-11-23）。クリップボードの許可がない環境では、古い方法でも試す */
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
    } catch (_) { /* 下の方法で */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (_) { return false; }
  }
  editorCopyBtn.addEventListener('click', async () => {
    const body = editorBodyInput.value;
    if (!body.trim()) { showToast('本文がありません'); return; }
    const ok = await copyText(body);
    showToast(ok ? '本文をコピーしました' : 'コピーできませんでした');
  });

  function renderFreqTagPicker() {
    freqTagPicker.innerHTML = '';
    frequentTags.forEach(tag => {
      const isActive = editTags.includes(tag);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (isActive ? ' active' : '');
      chip.textContent = tag;
      const color = tagColors[tag];
      if (color && isActive) {
        chip.style.borderColor = color;
        chip.style.color = color;
        chip.style.background = 'transparent';
      }
      chip.addEventListener('click', () => {
        if (editTags.includes(tag)) {
          editTags = editTags.filter(t => t !== tag);
        } else {
          editTags.push(tag);
        }
        renderTagInputRow();
        renderFreqTagPicker();
        scheduleSave();
      });
      freqTagPicker.appendChild(chip);
    });
  }

  /* フォルダ・ピンだけを書き換える（2026-11-23）。中身の「更新」日時は変えない。
     画面の値（entries）はすぐ変え、DBへの書き込みは自動保存と同じ列（savePromiseChain）に並べる。
     書き込む直前に entries から読み直すので、先に並んだ本文の保存を古い本文で上書きしない */
  function setMeta(id, patch) {
    const idx = entries.findIndex(e => e.id === id);
    if (idx < 0) return Promise.resolve(false);
    entries[idx] = { ...entries[idx], ...patch };
    if (patch.pinned === false) delete entries[idx].pinned;
    if (patch.folderId === null) delete entries[idx].folderId;
    savePromiseChain = savePromiseChain.then(async () => {
      const cur = entries.find(e => e.id === id);
      if (cur) await dbPut(cur);
      return true;
    }).catch((err) => {
      console.error(err);
      showToast('保存に失敗しました');
      return false;
    });
    return savePromiseChain;
  }

  function fillEditorFolderSelect(value) {
    editorFolderSelect.innerHTML = '';
    const opt = (v, label) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      editorFolderSelect.appendChild(o);
    };
    opt('', '未分類');
    folders.forEach(f => opt(f.id, f.name));
    editorFolderSelect.value = value || '';
  }
  function editorIsPinned() {
    if (!editingId) return editPinned;
    const e = entries.find(x => x.id === editingId);
    return !!(e && e.pinned);
  }
  function syncEditorPinBtn() {
    const on = editorIsPinned();
    editorPinBtn.classList.toggle('is-on', on);
    editorPinBtn.setAttribute('aria-pressed', String(on));
    editorPinBtn.textContent = on ? '📌 ピン止め中' : '📌 ピン止め';
  }
  editorFolderSelect.addEventListener('change', () => {
    const v = editorFolderSelect.value || null;
    if (v && !folders.some(f => f.id === v)) return;
    if (editingId) setMeta(editingId, { folderId: v });
    else editFolderId = v;
    showToast(`「${v ? folderName(v) : '未分類'}」に入れました`);
  });
  editorPinBtn.addEventListener('click', () => {
    const on = !editorIsPinned();
    if (editingId) setMeta(editingId, { pinned: on });
    else editPinned = on;
    syncEditorPinBtn();
  });

  function openEditor(entry) {
    editingId = entry ? entry.id : null;
    // 新規メモは、いま見ているフォルダに作る（「すべて」「未分類」なら未分類）
    editFolderId = entry ? null : (folders.some(f => f.id === activeFolder) ? activeFolder : null);
    editPinned = false;
    fillEditorFolderSelect(entry ? folderOf(entry) : editFolderId);
    syncEditorPinBtn();
    editTags = entry ? [...(entry.tags || [])] : [];
    editorTitleInput.value = entry ? (entry.title || '') : '';
    editorBodyInput.value = entry ? (entry.body || '') : '';
    editorTagInput.value = '';
    syncTagAddBtn();
    renderTagInputRow();
    renderFreqTagPicker();
    setEditorStatus(entry ? '\u00A0' : '新規メモ', null);
    editorOverlay.classList.add('is-open');
    editorIsOpen = true;
    editorTitleInput.focus();
  }

  async function closeEditor() {
    editorIsOpen = false;
    editorOverlay.classList.remove('is-open');

    // 誤作動防止：デバウンス待機中の変更を取りこぼさないよう即座にフラッシュする
    if (saveTimer) {
      editorIsOpen = true; // doSaveNow内のガードを一時的に解除して保存を確定させる
      await flushSave();
      editorIsOpen = false;
    }

    // 誤作動防止：タイトル・本文・タグすべて空の状態で閉じた場合は、
    // 既にDBに保存済みであっても空のゴミデータとして残さず削除する
    if (editingId && currentEditorIsEmpty()) {
      try {
        await dbDelete(editingId);
        entries = entries.filter(e => e.id !== editingId);
      } catch (err) {
        console.error('空メモの後片付けに失敗しました', err);
      }
    }

    editingId = null;
    editTags = [];
    editFolderId = null;
    editPinned = false;
    renderTagChips();
    renderFolderBar();
    renderGrid();
  }

  addBtn.addEventListener('click', () => openEditor(null));
  editorCloseBtn.addEventListener('click', closeEditor);
  editorOverlay.addEventListener('click', (e) => { if (e.target === editorOverlay) closeEditor(); });

  editorTitleInput.addEventListener('input', scheduleSave);
  editorBodyInput.addEventListener('input', scheduleSave);

  editorDeleteBtn.addEventListener('click', () => {
    if (!editingId) {
      // 新規・未保存メモの場合はDB操作不要。そのまま閉じるだけでよい。
      editTags = [];
      editorTitleInput.value = '';
      editorBodyInput.value = '';
      closeEditor();
      return;
    }
    openConfirmDelete(editingId, /* fromEditor */ true);
  });

  /* ===================== 削除確認（単数／複数の両方で使う） ===================== */
  let pendingDeleteIds = null;
  let pendingDeleteFromEditor = false;

  function openConfirmDelete(id, fromEditor) {
    pendingDeleteIds = [id];
    pendingDeleteFromEditor = !!fromEditor;
    confirmMsg.textContent = 'このメモを削除します。内容は復元できません。よろしいですか？';
    confirmOverlay.classList.add('is-open');
  }
  function openConfirmDeleteMultiple(ids) {
    pendingDeleteIds = ids;
    pendingDeleteFromEditor = false;
    confirmMsg.textContent = `選択した${ids.length}件を削除します。内容は復元できません。よろしいですか？`;
    confirmOverlay.classList.add('is-open');
  }
  function closeConfirmDelete() {
    pendingDeleteIds = null;
    pendingDeleteFromEditor = false;
    confirmOverlay.classList.remove('is-open');
  }
  confirmCancelBtn.addEventListener('click', closeConfirmDelete);
  confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) closeConfirmDelete(); });
  confirmDeleteBtn.addEventListener('click', async () => {
    if (!pendingDeleteIds || pendingDeleteIds.length === 0) return;
    const wasFromEditor = pendingDeleteFromEditor;
    const wasMultiple = pendingDeleteIds.length > 1;
    try {
      clearTimeout(saveTimer); // 削除確定後に古い自動保存が走らないよう止める
      saveTimer = null;
      for (const id of pendingDeleteIds) {
        await dbDelete(id);
      }
      entries = entries.filter(e => !pendingDeleteIds.includes(e.id));
      showToast(wasMultiple ? `${pendingDeleteIds.length}件削除しました` : '削除しました');
    } catch (err) {
      console.error(err);
      showToast('削除に失敗しました');
    } finally {
      closeConfirmDelete();
      if (wasFromEditor) {
        editorIsOpen = false;
        editingId = null;
        editTags = [];
        editorOverlay.classList.remove('is-open');
      }
      if (wasMultiple) exitSelectMode();
      renderTagChips();
      renderFolderBar();
      renderGrid();
    }
  });

  /* Tabの移動（2026-10-10）：メモの中だけを回る。
       タイトル → タグ（✕・入力欄・よく使うタグ）→ 本文 → ✕（一覧へ戻る）→ タイトル → …
     以前は本文の次が「このメモを削除」で、その先はメモの外（後ろの一覧の検索欄など）へ抜けていた。
     削除ボタンは tabindex="-1" でTabでは止まらない。Shift+Tabは逆回り。
     歯止め：日本語の変換中（MS-IMEは変換中のTabで予測候補を選ぶ）は何もしない／削除の確認を出している間も何もしない */
  function isComposingKey(e) { return e.isComposing || e.keyCode === 229; }
  editorOverlay.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || isComposingKey(e) || e.ctrlKey || e.altKey || e.metaKey) return;
    if (confirmOverlay.classList.contains('is-open')) return;
    const a = document.activeElement;
    let next = null;
    if (!e.shiftKey && a === editorBodyInput) next = editorCloseBtn;
    else if (!e.shiftKey && a === editorCloseBtn) next = editorTitleInput;
    else if (e.shiftKey && a === editorTitleInput) next = editorCloseBtn;
    else if (e.shiftKey && a === editorCloseBtn) next = editorBodyInput;
    if (next) { e.preventDefault(); next.focus(); }
  });
  // 歯止め：それでもメモの外（後ろの一覧）へフォーカスが行ったら、タイトルに戻す
  document.addEventListener('focusin', (e) => {
    if (!editorOverlay.classList.contains('is-open') || confirmOverlay.classList.contains('is-open')) return;
    if (!editorOverlay.contains(e.target)) editorTitleInput.focus();
  });

  document.addEventListener('keydown', (e) => {
    // 歯止め：日本語の変換を Esc で取り消したときに、メモまで閉じないように（2026-10-10）
    if (e.key === 'Escape' && !isComposingKey(e)) {
      if (confirmOverlay.classList.contains('is-open')) closeConfirmDelete();
      else if (editorOverlay.classList.contains('is-open')) closeEditor();
      else if (freqTagModalOverlay.classList.contains('is-open')) closeFreqTagModal();
      else if (tagColorModalOverlay.classList.contains('is-open')) closeTagColorModal();
      else if (moveModalOverlay.classList.contains('is-open')) closeMoveModal();
      else if (folderModalOverlay.classList.contains('is-open')) closeFolderModal();
      else if (tagMoreModalOverlay.classList.contains('is-open')) closeTagMoreModal();
      else if (menuPanel.classList.contains('is-open') || selectModeMenuPanel.classList.contains('is-open')) closeMenu();
    }
  });

  /* ===================== ハンバーガーメニュー ===================== */
  function activeMenuPanel() {
    return selectMode ? selectModeMenuPanel : menuPanel;
  }
  function openMenu() {
    activeMenuPanel().classList.add('is-open');
    hamburgerBtn.classList.add('is-active');
  }

  hamburgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeMenuPanel().classList.contains('is-open')) closeMenu(); else openMenu();

  document.addEventListener('click', (e) => {

      closeMenu();
    }

  /* ===================== メニュー項目：よく使うタグ ===================== */
  function openFreqTagModal() {
    closeMenu();
    renderFreqTagList();
    freqTagModalOverlay.classList.add('is-open');
  }
  function closeFreqTagModal() { freqTagModalOverlay.classList.remove('is-open'); }
  menuItemFreqTags.addEventListener('click', openFreqTagModal);
  freqTagModalCloseBtn.addEventListener('click', closeFreqTagModal);
  freqTagModalOverlay.addEventListener('click', (e) => { if (e.target === freqTagModalOverlay) closeFreqTagModal(); });

  function renderFreqTagList() {

    } else {

  async function addFrequentTag() {
    const val = freqTagAddInput.value.trim();

      showToast('すでに登録されています');

  freqTagAddBtn.addEventListener('click', addFrequentTag);
  freqTagAddInput.addEventListener('keydown', (e) => {

  /* ===================== メニュー項目：タグの色 ===================== */
  function openTagColorModal() {
    closeMenu();
    renderTagColorList();
    tagColorModalOverlay.classList.add('is-open');
  }
  function closeTagColorModal() { tagColorModalOverlay.classList.remove('is-open'); }
  menuItemTagColors.addEventListener('click', openTagColorModal);
  tagColorModalCloseBtn.addEventListener('click', closeTagColorModal);
  tagColorModalOverlay.addEventListener('click', (e) => { if (e.target === tagColorModalOverlay) closeTagColorModal(); });

  function getColorableTags() {
    const set = new Set([...getAllTags(), ...frequentTags]);
    return Array.from(set).sort();
  }

  function renderTagColorList() {
    const tags = getColorableTags();
    tagColorList.innerHTML = '';
    if (tags.length === 0) {
      tagColorList.innerHTML = '<div class="menu-empty-hint">タグを登録すると、ここで色を設定できるようになります。</div>';
      return;
    }
    tags.forEach(tag => {
      const row = document.createElement('div');
      row.className = 'tag-color-row';

      row.innerHTML = `
        <span class="tcr-name">${escapeHtml(tag)}</span>
        <span class="tcr-controls">
          <input type="color" value="${current}" data-tag="${escapeHtml(tag)}">
          <button type="button" class="tcr-reset" data-tag="${escapeHtml(tag)}">既定に戻す</button>
        </span>
      `;
      const colorInput = row.querySelector('input[type="color"]');
      colorInput.addEventListener('input', async () => {
        tagColors[tag] = colorInput.value;
        await dbSetSetting('tagColors', tagColors);
        renderGrid();
        renderTagChips();
        renderTagInputRow();
        renderFreqTagPicker();
      });
      row.querySelector('.tcr-reset').addEventListener('click', async () => {
        delete tagColors[tag];
        await dbSetSetting('tagColors', tagColors);
        renderTagColorList();
        renderGrid();
        renderTagChips();
        renderTagInputRow();
        renderFreqTagPicker();
      });
      tagColorList.appendChild(row);
    });
  }

  /* ===================== メニュー項目：フォルダの管理（2026-11-23） =====================
     歯止め：
       ・名前は空・同じ名前・30文字より長いものを受け付けない（長い分は切る）。50個まで
       ・消すのは2回押し（1回目で「もう一度で削除」、3秒で元に戻る）。中のメモは消さずに「未分類」へ移す
       ・フォルダを先に消してからメモの印を外す。途中で止まっても、消えたフォルダの印は「未分類」として見える */
  function sanitizeFolders(v) {
    if (!Array.isArray(v)) return [];
    const seen = new Set();
    return v.filter(f => f && typeof f.id === 'string' && typeof f.name === 'string' && f.name.trim() && !seen.has(f.id) && seen.add(f.id))
      .map(f => ({ id: f.id, name: f.name.trim().slice(0, FOLDER_NAME_MAX) }));
  }
  function normFolderName(s) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, FOLDER_NAME_MAX); }
  function folderNameError(name, exceptId) {
    if (!name) return 'フォルダの名前を入れてください';
    if (name === 'すべて' || name === '未分類') return `「${name}」は使えない名前です`;
    if (folders.some(f => f.name === name && f.id !== exceptId)) return '同じ名前のフォルダがあります';
    return '';
  }
  async function saveFolders() {
    try { await dbSetSetting('folders', folders); return true; }
    catch (err) { console.error(err); showToast('フォルダを保存できませんでした'); return false; }
  }
  function refreshAfterFolderChange() {
    renderFolderList();
    renderFolderBar();
    renderGrid();
    if (editorIsOpen) fillEditorFolderSelect(editingId ? folderOf(entries.find(e => e.id === editingId)) : editFolderId);
  }

  function openFolderModal() {
    closeMenu();
    renderFolderList();
    folderModalOverlay.classList.add('is-open');
    if (window.matchMedia('(pointer: fine)').matches) folderAddInput.focus();
  }
  function closeFolderModal() {
    disarmFolderDelete();
    folderModalOverlay.classList.remove('is-open');
  }
  menuItemFolders.addEventListener('click', openFolderModal);
  folderModalCloseBtn.addEventListener('click', closeFolderModal);
  folderModalOverlay.addEventListener('click', (e) => { if (e.target === folderModalOverlay) closeFolderModal(); });

  async function addFolder() {
    const name = normFolderName(folderAddInput.value);
    const err = folderNameError(name, null);
    if (err) { showToast(err); return; }
    if (folders.length >= FOLDER_MAX) { showToast(`フォルダは${FOLDER_MAX}個までです`); return; }
    folders.push({ id: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), name });
    if (!(await saveFolders())) { folders.pop(); return; }
    folderAddInput.value = '';
    showToast(`「${name}」を作りました`);
    refreshAfterFolderChange();
  }
  folderAddBtn.addEventListener('click', addFolder);
  // Enter でも作れる（変換の確定では動かない）。スマホのキーボードは Enter を知らせないことがあるので、「追加」ボタンが確実な手段
  folderAddInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !isComposingKey(e)) { e.preventDefault(); addFolder(); }
  });

  let folderDelArmed = null; // { id, timer }
  function disarmFolderDelete() {
    if (!folderDelArmed) return;
    clearTimeout(folderDelArmed.timer);
    folderDelArmed = null;
    folderList.querySelectorAll('.fr-del.is-armed').forEach(b => { b.classList.remove('is-armed'); b.textContent = '削除'; });
  }

  function renderFolderList() {
    folderDelArmed && clearTimeout(folderDelArmed.timer);
    folderDelArmed = null;
    folderList.innerHTML = '';
    if (folders.length === 0) {
      folderList.innerHTML = '<div class="menu-empty-hint">まだフォルダがありません。上の欄に名前を入れて追加してください。</div>';
      return;
    }
    const counts = new Map();
    entries.forEach(e => { const f = folderOf(e); if (f) counts.set(f, (counts.get(f) || 0) + 1); });
    folders.forEach((f, idx) => {
      const row = document.createElement('div');
      row.className = 'folder-row';
      row.dataset.id = f.id;
      const name = document.createElement('input');
      name.type = 'text'; name.className = 'fr-name'; name.value = f.name; name.maxLength = FOLDER_NAME_MAX;
      name.setAttribute('aria-label', 'フォルダの名前');
      // 名前の変更：欄を離れたとき・Enter（change）で確定。だめな名前なら元に戻す
      name.addEventListener('change', async () => {
        const nn = normFolderName(name.value);
        if (nn === f.name) { name.value = f.name; return; }
        const err = folderNameError(nn, f.id);
        if (err) { showToast(err); name.value = f.name; return; }
        const old = f.name;
        f.name = nn;
        if (!(await saveFolders())) { f.name = old; name.value = old; return; }
        name.value = nn;
        showToast('名前を変えました');
        renderFolderBar();
        renderGrid();
        if (editorIsOpen) fillEditorFolderSelect(editingId ? folderOf(entries.find(e => e.id === editingId)) : editFolderId);
      });
      name.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !isComposingKey(e)) { e.preventDefault(); name.blur(); }
      });
      const count = document.createElement('span');
      count.className = 'fr-count';
      count.textContent = `${counts.get(f.id) || 0}件`;
      const mk = (label, title, cls) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = label; b.title = title;
        if (cls) b.className = cls;
        return b;
      };
      const up = mk('↑', '上へ');
      const down = mk('↓', '下へ');
      up.disabled = idx === 0;
      down.disabled = idx === folders.length - 1;
      const swap = async (j) => {
        [folders[idx], folders[j]] = [folders[j], folders[idx]];
        if (!(await saveFolders())) [folders[idx], folders[j]] = [folders[j], folders[idx]];
        refreshAfterFolderChange();
      };
      up.addEventListener('click', () => swap(idx - 1));
      down.addEventListener('click', () => swap(idx + 1));
      const del = mk('削除', 'フォルダを消す（2回押す。中のメモは「未分類」へ）', 'fr-del');
      del.addEventListener('click', async () => {
        if (!folderDelArmed || folderDelArmed.id !== f.id) {
          disarmFolderDelete();
          const n = counts.get(f.id) || 0;
          del.classList.add('is-armed');
          del.textContent = n ? `もう一度で削除（${n}件は未分類へ）` : 'もう一度で削除';
          folderDelArmed = { id: f.id, timer: setTimeout(disarmFolderDelete, 3000) };
          return;
        }
        disarmFolderDelete();
        const removed = f;
        folders = folders.filter(x => x.id !== removed.id);
        if (!(await saveFolders())) { folders.splice(idx, 0, removed); refreshAfterFolderChange(); return; }
        const inside = entries.filter(e => e.folderId === removed.id).map(e => e.id);
        inside.forEach(id => setMeta(id, { folderId: null }));
        if (editFolderId === removed.id) editFolderId = null;
        if (activeFolder === removed.id) setActiveFolder('all');
        showToast(`「${removed.name}」を消しました${inside.length ? `（${inside.length}件は未分類へ）` : ''}`);
        refreshAfterFolderChange();
      });
      row.append(name, count, up, down, del);
      folderList.appendChild(row);
    });
  }

  /* ---- 選んだメモをフォルダへ移動（選択モード。2026-11-23） ---- */
  function openMoveModal() {
    closeMenu();
    if (selectedForDelete.size === 0) { showToast('移動するメモを選んでください'); return; }
    moveModalTitle.textContent = `${selectedForDelete.size}件をフォルダへ移動`;
    moveList.innerHTML = '';
    const add = (id, label) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'folder-chip';
      b.innerHTML = `<span class="fc-name">${escapeHtml(label)}</span>`;
      b.addEventListener('click', () => {
        const ids = Array.from(selectedForDelete);
        ids.forEach(x => setMeta(x, { folderId: id }));
        closeMoveModal();
        showToast(`${ids.length}件を「${label}」へ移動しました`);
        exitSelectMode();
        renderFolderBar();
      });
      moveList.appendChild(b);
    };
    folders.forEach(f => add(f.id, f.name));
    add(null, '未分類');
    if (!folders.length) {
      const hint = document.createElement('div');
      hint.className = 'menu-empty-hint';
      hint.textContent = 'まだフォルダがありません。☰ →「フォルダの管理」で作れます。';
      moveList.prepend(hint);
    }
    moveModalOverlay.classList.add('is-open');
  }
  function closeMoveModal() { moveModalOverlay.classList.remove('is-open'); }
  menuItemMoveSelected.addEventListener('click', openMoveModal);
  moveModalCloseBtn.addEventListener('click', closeMoveModal);
  moveModalOverlay.addEventListener('click', (e) => { if (e.target === moveModalOverlay) closeMoveModal(); });

  /* ===================== メニュー項目：選択削除モード ===================== */
  function setSelectModeUiLock(locked) {
    // 歯止め：選んでいる間はフォルダを切り替えない（見えていないメモを選んだまま消さないように）
    folderBar.classList.toggle('is-locked', locked);
    searchInput.disabled = locked;
    addBtn.disabled = locked;
    addBtn.style.opacity = locked ? '.4' : '';
    addBtn.style.pointerEvents = locked ? 'none' : '';
    tagChips.style.opacity = locked ? '.4' : '';
    tagChips.style.pointerEvents = locked ? 'none' : '';
  }

  function enterSelectMode() {
    selectMode = true;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.add('is-active');
    setSelectModeUiLock(true);
    renderGrid();
    renderTagChips();
  }
  function exitSelectMode() {
    selectMode = false;
    selectedForDelete.clear();
    closeMenu();
    selectModeHint.classList.remove('is-active');
    setSelectModeUiLock(false);
    renderGrid();
    renderTagChips();
  }
  function toggleSelectForDelete(id) {
    if (selectedForDelete.has(id)) selectedForDelete.delete(id);
    else selectedForDelete.add(id);
    renderGrid();
  }
  menuItemSelectMode.addEventListener('click', enterSelectMode);
  menuItemExitSelect.addEventListener('click', exitSelectMode);
  menuItemDeleteSelected.addEventListener('click', () => {
    closeMenu();
    if (selectedForDelete.size === 0) {
      showToast('削除する項目を選択してください');
      return;
    }
    openConfirmDeleteMultiple(Array.from(selectedForDelete));
  });

  /* ===================== 離脱時の保存確実化 =====================
     誤作動防止：エディタを開いたままタブを閉じる／リロードするケースで、
     デバウンス待機中の変更が失われないよう同期的に警告を出す。
     （非同期の保存処理自体はbeforeunload内では確実に完了しないため、
       あくまで「保存されていない可能性」をブラウザ標準の確認ダイアログで
       伝える設計。日頃はEscやeditorCloseBtnで確実にflushされる。） */
  window.addEventListener('beforeunload', (e) => {
    if (editorIsOpen && saveTimer) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ===================== 一時メモから届いたメモ（2026-11-24） =====================
     本体の一時メモの「ノートへ」は、このアプリと同じ DB に直接書き込み、Stage のこのアプリへ知らせる。
     知らせが来たら、DB から「まだ持っていないメモ」だけを読み足す（持っているメモは置き換えない。
     編集中・フォルダやピンの書き込み待ちの値を古い値で上書きしないように） */
  async function addMissingFromDb() {
    if (!db) return;
    const all = await dbGetAll();
    const have = new Set(entries.map(e => e.id));
    const fresh = all.filter(e => e && !have.has(e.id));
    if (!fresh.length) return;
    entries.push(...fresh);
    renderTagChips();
    renderFolderBar();
    renderGrid();
    showToast('一時メモから届きました');
  }
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent || e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'sideops:memo-added') return;
    addMissingFromDb().catch((err) => console.error(err));
  });

  /* ===================== 初期化 ===================== */
  openDb().then(async (_db) => {
    db = _db;
    const savedFreqTags = await dbGetSetting('frequentTags');
    const savedTagColors = await dbGetSetting('tagColors');
    frequentTags = Array.isArray(savedFreqTags) ? savedFreqTags : [];
    tagColors = (savedTagColors && typeof savedTagColors === 'object') ? savedTagColors : {};
    folders = sanitizeFolders(await dbGetSetting('folders'));
    await loadAndRender();
  }).catch((err) => {
    console.error('IndexedDBの初期化に失敗しました', err);
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="big">保存機能を利用できません</div>
      <div class="small">このブラウザ／モードではIndexedDBが利用できないため、メモは保存されません。プライベートブラウジングモードなどをご確認ください。</div>
    </div>`;
  });
})();
</script>
</body>
</html>
