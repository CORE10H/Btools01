<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像生成プロンプト見本一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a; --panel: #0e1620; --line: #1e3038; --line-soft: #14212a;
    --cyan: #00f0d0; --cyan-dim: #0a4a44; --text: #f5f9fa; --text-dim: #b8c4cc; --text-faint: #5c6b73;
    --font-display: 'Rajdhani', sans-serif; --font-body: 'IBM Plex Sans JP', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .app-shell { height: 100%; display: flex; flex-direction: column; }
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .app-bar .app-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); letter-spacing: .04em; }
  .app-bar .app-tag { font-size: 9px; letter-spacing: .1em; color: var(--text-faint); font-family: var(--font-display); border: 1px solid var(--line); padding: 2px 7px; }
  .app-body {
    flex: 1; overflow-y: auto; padding: 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
    align-content: start;
  }
  .slot {
    aspect-ratio: 1; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 11px; text-align: center; padding: 8px;
  }
  .slot.add { color: var(--cyan-dim); font-size: 24px; cursor: pointer; }
  .note {
    padding: 14px 20px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--text-faint); line-height: 1.7; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-bar">
    <span class="app-title">// PROMPT GALLERY</span>
    <span class="app-tag">未実装</span>
  </div>
  <div class="app-body">
    <div class="slot add">＋</div>
    <div class="slot">画像＋プロンプト<br>登録スロット（予定）</div>
    <div class="slot">画像＋プロンプト<br>登録スロット（予定）</div>
    <div class="slot">画像＋プロンプト<br>登録スロット（予定）</div>
  </div>
  <div class="note">
    ダミーページです。今後、画像とプロンプトを登録・保存できるギャラリーとして実装予定（保存先：IndexedDB、クラウド同期なし）。
  </div>
</div>
</body>
</html>
